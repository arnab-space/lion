<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iShop API Monitor | Enterprise</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts Analytics -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- html2canvas and jsPDF for PDF Report Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(220,100%,77%,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(28,100%,74%,0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(220,100%,77%,0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.1);
            border-color: rgba(234, 88, 12, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };

        const App = () => {
            const dashboardRef = useRef(null);
            
            const defaultCheckIn = new Date();
            defaultCheckIn.setDate(defaultCheckIn.getDate() + 15);
            const defaultCheckOut = new Date(defaultCheckIn);
            defaultCheckOut.setDate(defaultCheckOut.getDate() + 1);

            const [city, setCity] = useState("Kolkata");
            const [checkIn, setCheckIn] = useState(formatDate(defaultCheckIn));
            const [checkOut, setCheckOut] = useState(formatDate(defaultCheckOut));
            const [loading, setLoading] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [hotels, setHotels] = useState([]);
            const [error, setError] = useState(null);

            const handleCheckInChange = (e) => {
                const newCheckInDate = e.target.value;
                setCheckIn(newCheckInDate);
                const nextDay = new Date(newCheckInDate);
                nextDay.setDate(nextDay.getDate() + 1);
                setCheckOut(formatDate(nextDay));
            };

            const handleSearch = async () => {
                setLoading(true);
                setError(null);
                setHotels([]); 
                try {
                    const TUNNEL_URL = "https://jpeg-farms-throwing-recommend.trycloudflare.com";
                    const API_URL = `${TUNNEL_URL}/scrape?city=${city}&checkin=${checkIn}&checkout=${checkOut}`;
                    
                    const response = await fetch(API_URL);
                    const data = await response.json();
                    
                    if (data.status === "success" && data.hotels && data.hotels.length > 0) {
                        setHotels(data.hotels);
                    } else {
                        setHotels([]);
                        setError(data.error || "Website returned 0 properties. Check proxy or session state.");
                    }
                } catch (err) {
                    setError("Scraping engine unreachable. Verify the Cloudflare tunnel and local uvicorn server.");
                    setHotels([]);
                } finally {
                    setLoading(false);
                }
            };

            const { ctWinRate, supplierShare, starData, parsedHotels } = useMemo(() => {
                if (!hotels || hotels.length === 0) return { ctWinRate: 0, supplierShare: [], starData: [], parsedHotels: [] };

                let ctWins = 0, totalValid = 0;
                let suppliers = { Cleartrip: 0, MakeMyTrip: 0, Yatra: 0, TripSure: 0 };
                let stars = { "5 Star": { ct: 0, comp: 0 }, "4 Star": { ct: 0, comp: 0 }, "3 Star": { ct: 0, comp: 0 }, "2 Star": { ct: 0, comp: 0 } };
                let processedList = [];

                hotels.forEach(hotel => {
                    let prices = { cleartrip: null, makemytrip: null, yatra: null, tripsure: null };

                    (hotel.priceSummary || []).forEach(sup => {
                        const name = sup.partnerName?.toLowerCase() || "";
                        if (name.includes("cleartrip")) prices.cleartrip = sup.price;
                        else if (name.includes("makemytrip") || name.includes("mmt")) prices.makemytrip = sup.price;
                        else if (name.includes("yatra")) prices.yatra = sup.price;
                        else if (name.includes("tripsure")) prices.tripsure = sup.price;
                    });

                    if (prices.cleartrip) suppliers.Cleartrip++;
                    if (prices.makemytrip) suppliers.MakeMyTrip++;
                    if (prices.yatra) suppliers.Yatra++;
                    if (prices.tripsure) suppliers.TripSure++;

                    let bestSupplier = "N/A";
                    let bestPrice = Infinity;
                    
                    Object.entries(prices).forEach(([sup, price]) => {
                        if (price && price < bestPrice) {
                            bestPrice = price;
                            bestSupplier = sup;
                        }
                    });

                    // Accurate Cleartrip specific CT_HID extraction from priceSummary
                    let ct_hid = "N/A";
                    if (hotel.priceSummary && Array.isArray(hotel.priceSummary)) {
                        const ctPartner = hotel.priceSummary.find(sup => sup.partnerName?.toLowerCase().includes("cleartrip"));
                        if (ctPartner && ctPartner.hotelId) {
                            ct_hid = ctPartner.hotelId;
                        }
                    }
                    if (ct_hid === "N/A") {
                        ct_hid = hotel.hotelKey || hotel.hotelId || hotel.hotelInfo?.hotelId || "N/A";
                    }

                    processedList.push({
                        ct_hid,
                        name: hotel.hotelInfo?.name || "Unknown Hotel",
                        rating: hotel.hotelInfo?.starRating || "N/A",
                        location: hotel.hotelInfo?.address || "Unknown Location",
                        image: hotel.hotelInfo?.thumbnailUrl || "https://images.unsplash.com/photo-1566073171526-87e2aa219159?q=80&w=600&auto=format&fit=crop",
                        bestSupplier,
                        bestPrice: bestPrice === Infinity ? "N/A" : bestPrice,
                        rawPrices: prices
                    });

                    if (prices.cleartrip) {
                        const compPrices = [prices.makemytrip, prices.yatra, prices.tripsure].filter(p => p !== null);
                        if (compPrices.length > 0) {
                            totalValid++;
                            const minComp = Math.min(...compPrices);
                            if (prices.cleartrip <= minComp) ctWins++;

                            const ratingInt = Math.floor(hotel.hotelInfo?.starRating || 3);
                            const starKey = `${ratingInt} Star`;
                            if (stars[starKey]) {
                                if (prices.cleartrip <= minComp) stars[starKey].ct++;
                                else stars[starKey].comp++;
                            }
                        }
                    }
                });

                const winRate = totalValid > 0 ? ((ctWins / totalValid) * 100).toFixed(1) : 0;
                
                const pieData = [
                    { name: "Cleartrip", value: suppliers.Cleartrip, color: "#ea580c" },
                    { name: "MakeMyTrip", value: suppliers.MakeMyTrip, color: "#2563eb" },
                    { name: "Yatra", value: suppliers.Yatra, color: "#dc2626" },
                    { name: "TripSure", value: suppliers.TripSure, color: "#16a34a" }
                ].filter(d => d.value > 0);

                const barData = Object.keys(stars)
                    .filter(key => stars[key].ct > 0 || stars[key].comp > 0)
                    .map(key => ({
                        name: key,
                        "CT Win": stars[key].ct,
                        "Comp Win": stars[key].comp
                    })).reverse();

                return { ctWinRate: winRate, supplierShare: pieData, starData: barData, parsedHotels: processedList };
            }, [hotels]);

            const exportToExcel = () => {
                if (parsedHotels.length === 0) return;
                const flatData = parsedHotels.map(h => ({
                    "CT_HID": h.ct_hid,
                    "Hotel Name": h.name,
                    "Location": h.location,
                    "Star Rating": h.rating,
                    "Cleartrip Price": h.rawPrices.cleartrip || "N/A",
                    "MakeMyTrip Price": h.rawPrices.makemytrip || "N/A",
                    "Yatra Price": h.rawPrices.yatra || "N/A",
                    "TripSure Price": h.rawPrices.tripsure || "N/A",
                    "Overall Best": h.bestSupplier.toUpperCase()
                }));
                const ws = XLSX.utils.json_to_sheet(flatData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Scrape_Data");
                XLSX.writeFile(wb, `Telemetry_${city}_${checkIn}.xlsx`);
            };

            const exportToPDF = async () => {
                if (!dashboardRef.current) return;
                setIsExporting(true);
                try {
                    const canvas = await html2canvas(dashboardRef.current, { 
                        scale: 1.5, 
                        useCORS: true, 
                        allowTaint: true, 
                        backgroundColor: "#f8fafc" 
                    });
                    const imgData = canvas.toDataURL("image/png");
                    const pdf = new window.jspdf.jsPDF("p", "mm", "a4");
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    let heightLeft = imgHeight;
                    let position = 0;
                    pdf.addImage(imgData, "PNG", 0, position, pdfWidth, imgHeight);
                    heightLeft -= pdfHeight;
                    while (heightLeft >= 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, "PNG", 0, position, pdfWidth, imgHeight);
                        heightLeft -= pdfHeight;
                    }
                    pdf.save(`Scrape_Report_${city}.pdf`);
                } catch (error) {
                    console.error("PDF generation error:", error);
                    alert("PDF Generation Failed. Check console logs for details.");
                } finally {
                    setIsExporting(false);
                }
            };

            const SkeletonLoader = () => (
                <div className="max-w-6xl mx-auto mt-8 px-4 w-full animate-pulse">
                    <div className="flex justify-center mb-8">
                        <div className="flex items-center gap-3 bg-white/60 px-6 py-3 rounded-full border border-white shadow-sm">
                            <div className="w-5 h-5 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                            <span className="text-sm font-semibold text-slate-600">Scraping live rates for {city}... Please wait up to 25 seconds for heavy payloads.</span>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="h-44 glass-card rounded-2xl"></div>
                        <div className="h-44 glass-card rounded-2xl"></div>
                        <div className="h-44 glass-card rounded-2xl"></div>
                    </div>
                    <div className="space-y-4">
                        {[1, 2, 3].map(i => (
                            <div key={i} className="glass-card rounded-2xl p-4 flex gap-4 h-36">
                                <div className="w-48 h-full bg-slate-200/50 rounded-xl"></div>
                                <div className="flex-1 py-2"><div className="h-4 bg-slate-200/50 rounded w-16 mb-4"></div><div className="h-6 bg-slate-200/50 rounded w-3/4"></div></div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="pb-16 relative">
                    <nav className="glass-header sticky top-0 z-50 px-8 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <div className="bg-gradient-to-br from-orange-500 to-orange-600 text-white p-2.5 rounded-xl shadow-[0_4px_12px_rgba(234,88,12,0.3)]">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                            </div>
                            <div className="flex flex-col">
                                <span className="text-slate-900 font-extrabold text-xl tracking-tight leading-none">iShop Rewards</span>
                                <span className="text-slate-500 text-xs font-semibold tracking-widest uppercase mt-1">Telemetry Dashboard</span>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-5xl mx-auto mt-10 px-4 relative z-40">
                        <div className="glass-card p-2 rounded-2xl flex items-center gap-2">
                            <div className="flex-1 flex items-center px-5 py-3 glass-input rounded-xl mr-1">
                                <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <div className="flex flex-col w-full">
                                    <input type="text" value={city} onChange={(e) => setCity(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                                        className="text-lg font-bold text-slate-800 bg-transparent focus:outline-none w-full placeholder-slate-400" placeholder="Destination" />
                                    <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mt-0.5">Location</span>
                                </div>
                            </div>

                            <div className="flex items-center px-5 py-3 glass-input rounded-xl mr-1 min-w-[170px]">
                                <svg className="w-5 h-5 text-orange-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <div className="flex flex-col w-full">
                                    <input type="date" value={checkIn} onChange={handleCheckInChange} className="font-bold text-slate-800 text-sm bg-transparent focus:outline-none w-full cursor-pointer" />
                                    <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mt-0.5">Check In</span>
                                </div>
                            </div>

                            <div className="flex items-center px-5 py-3 glass-input rounded-xl mr-1 min-w-[170px] opacity-70">
                                <div className="flex flex-col w-full pl-8">
                                    <input type="date" value={checkOut} readOnly className="font-bold text-slate-600 text-sm bg-transparent focus:outline-none w-full pointer-events-none" />
                                    <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mt-0.5">Check Out</span>
                                </div>
                            </div>

                            <button onClick={handleSearch} disabled={loading}
                                className="bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-10 rounded-xl shadow-[0_4px_20px_rgba(15,23,42,0.3)] transition-all duration-300 disabled:opacity-50 disabled:shadow-none flex items-center">
                                {loading ? 'Running...' : 'Execute'}
                            </button>
                        </div>
                    </div>

                    {loading && <SkeletonLoader />}

                    {error && !loading && (
                        <div className="max-w-md mx-auto mt-24 text-center glass-card p-10 rounded-3xl animate-in fade-in zoom-in duration-300">
                            <div className="bg-slate-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-slate-200">
                                <svg className="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <h3 className="text-xl font-bold text-slate-800 mb-2">No Results Found</h3>
                            <p className="text-sm text-slate-500 font-medium leading-relaxed">{error}</p>
                        </div>
                    )}

                    {!loading && hotels.length > 0 && (
                        <div className="max-w-6xl mx-auto mt-10 px-4 animate-in fade-in slide-in-from-bottom-8 duration-500" ref={dashboardRef}>
                            <div className="flex justify-between items-end mb-8">
                                <div>
                                    <h1 className="text-4xl font-black text-slate-900 tracking-tight mb-2">{city}</h1>
                                    <div className="flex items-center gap-3">
                                        <span className="flex items-center gap-1.5 text-xs font-bold text-emerald-700 bg-emerald-100/80 px-2.5 py-1 rounded-md border border-emerald-200">
                                            <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                                            LIVE TELEMETRY
                                        </span>
                                        <span className="text-slate-500 text-sm font-semibold">{hotels.length} Properties Analyzed</span>
                                    </div>
                                </div>
                                <div className="flex gap-3" data-html2canvas-ignore="true">
                                    <button onClick={exportToExcel} className="glass-card flex items-center text-sm font-bold text-slate-700 px-5 py-2.5 rounded-xl hover:bg-white transition-all shadow-sm">
                                        Export Data
                                    </button>
                                    <button onClick={exportToPDF} disabled={isExporting} className="bg-white border border-slate-200 shadow-sm flex items-center text-sm font-bold text-orange-600 px-5 py-2.5 rounded-xl hover:bg-orange-50 transition-all disabled:opacity-50">
                                        {isExporting ? 'Generating...' : 'Download Report'}
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="glass-card rounded-3xl p-8 flex flex-col justify-center relative overflow-hidden">
                                    <h3 className="text-slate-500 font-bold text-xs tracking-widest uppercase mb-2">Cleartrip Win Rate</h3>
                                    <div className="text-6xl font-black text-slate-900 tracking-tighter">{ctWinRate}<span className="text-3xl text-slate-400">%</span></div>
                                    <p className="text-slate-500 text-xs font-semibold mt-4 bg-white/50 inline-block px-3 py-1.5 rounded-lg border border-white w-max">Cheapest Provider</p>
                                </div>

                                <div className="glass-card rounded-3xl p-6 h-[240px] flex flex-col">
                                    <h3 className="text-slate-500 font-bold text-xs tracking-widest uppercase mb-4 text-center">Wins by Category</h3>
                                    <div className="flex-grow w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={starData} layout="vertical" margin={{ top: 0, right: 20, left: -20, bottom: 0 }}>
                                                <XAxis type="number" hide />
                                                <YAxis dataKey="name" type="category" domain={[25, 60]} axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 11, fontWeight: 700}} />
                                                <Tooltip cursor={{fill: 'rgba(255,255,255,0.4)'}} contentStyle={{borderRadius: '12px', border: '1px solid #e2e8f0', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                                <Legend iconType="circle" wrapperStyle={{fontSize: '10px', fontWeight: 700, paddingTop: '10px'}} />
                                                <Bar dataKey="CT Win" stackId="a" fill="#ea580c" barSize={12} />
                                                <Bar dataKey="Comp Win" stackId="a" fill="#cbd5e1" radius={[0, 4, 4, 0]} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="glass-card rounded-3xl p-6 h-[240px] flex flex-col relative">
                                    <h3 className="text-slate-500 font-bold text-xs tracking-widest uppercase mb-2 text-center absolute top-6 w-full left-0">Market Distribution</h3>
                                    <div className="flex-grow w-full mt-8">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={supplierShare} innerRadius={50} outerRadius={70} paddingAngle={3} dataKey="value" stroke="none">
                                                    {supplierShare.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.color} />
                                                    ))}
                                                </Pie>
                                                <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{fontSize: '10px', fontWeight: 700}} />
                                                <Tooltip contentStyle={{borderRadius: '12px', border: '1px solid #e2e8f0', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-3">
                                {parsedHotels.map((hotel, idx) => (
                                    <div key={idx} className="glass-card rounded-2xl p-3 flex gap-5 hover:bg-white/80 transition-all duration-300 group">
                                        <div className="w-48 h-32 rounded-xl bg-slate-200 overflow-hidden relative shadow-inner">
                                            <img src={hotel.image} alt="hotel" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                            {hotel.bestSupplier === 'cleartrip' && (
                                                <div className="absolute top-2 left-2 bg-orange-500/90 backdrop-blur text-white text-[9px] font-black tracking-wider px-2 py-1 rounded shadow-sm">
                                                    CT WIN
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex-1 flex justify-between py-1 pr-2">
                                            <div className="flex flex-col justify-center">
                                                <div className="flex items-center gap-2 mb-1.5">
                                                    <span className="text-[10px] font-black text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200">
                                                        ★ {hotel.rating}
                                                    </span>
                                                    <span className="text-[10px] font-bold text-slate-400 tracking-wider">ID: {hotel.ct_hid}</span>
                                                </div>
                                                <h2 className="text-xl font-bold text-slate-800 leading-tight mb-1 group-hover:text-orange-600 transition-colors">{hotel.name}</h2>
                                                <p className="text-slate-500 text-xs font-semibold">{hotel.location}</p>
                                            </div>

                                            <div className="flex flex-col items-end justify-center pl-6">
                                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Lowest Rate</span>
                                                {hotel.bestPrice !== "N/A" ? (
                                                    <>
                                                        <div className="text-3xl font-black text-slate-900 tracking-tighter">₹{hotel.bestPrice.toLocaleString('en-IN')}</div>
                                                        <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider mt-1 ${
                                                            hotel.bestSupplier === 'cleartrip' ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-500'
                                                        }`}>
                                                            {hotel.bestSupplier}
                                                        </span>
                                                    </>
                                                ) : (
                                                    <span className="bg-slate-100 text-slate-400 font-bold text-xs px-3 py-1 rounded">Unavailable</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
