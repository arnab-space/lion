<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iShop Real-Time Scraper Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts for Analytics -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <!-- SheetJS for dynamic Excel Export -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- html2canvas and jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ea580c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

        // Utility to format date to YYYY-MM-DD
        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };

        const App = () => {
            const dashboardRef = useRef(null);
            
            // Set default dates (Check-in = today + 15 days)
            const defaultCheckIn = new Date();
            defaultCheckIn.setDate(defaultCheckIn.getDate() + 15);
            
            const defaultCheckOut = new Date(defaultCheckIn);
            defaultCheckOut.setDate(defaultCheckOut.getDate() + 1);

            const [city, setCity] = useState("Mumbai");
            const [checkIn, setCheckIn] = useState(formatDate(defaultCheckIn));
            const [checkOut, setCheckOut] = useState(formatDate(defaultCheckOut));
            const [loading, setLoading] = useState(false);
            const [hotels, setHotels] = useState([]);
            const [error, setError] = useState(null);

            // Automatically update Check-out to Check-in + 1 day when Check-in changes
            const handleCheckInChange = (e) => {
                const newCheckInDate = e.target.value;
                setCheckIn(newCheckInDate);
                
                const nextDay = new Date(newCheckInDate);
                nextDay.setDate(nextDay.getDate() + 1);
                setCheckOut(formatDate(nextDay));
            };

            const handleSearch = async () => {
                setLoading(true);
                setError(null);
                try {
                    // Make sure to replace this URL with your actual Render URL when deployed
                    const apiUrl = `https://ishop-api-ukla.onrender.com/scrape?city=${city}&checkin=${checkIn}&checkout=${checkOut}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    
                    if (data.status === "success" && data.hotels) {
                        setHotels(data.hotels);
                    } else {
                        setHotels([]);
                        setError(data.error || "No hotels found. Please try a different search.");
                    }
                } catch (err) {
                    console.error("Fetch failed:", err);
                    setError("Unable to connect to the scraping API. Ensure the backend is running.");
                    setHotels([]);
                } finally {
                    setLoading(false);
                }
            };

            // Process data for KPIs and Charts
            const { ctWinRate, supplierShare, starData, parsedHotels } = useMemo(() => {
                let ctWins = 0;
                let totalValid = 0;
                let suppliers = { Cleartrip: 0, MakeMyTrip: 0, Yatra: 0, TripSure: 0 };
                let stars = { "5 Star": { ct: 0, comp: 0 }, "4 Star": { ct: 0, comp: 0 }, "3 Star": { ct: 0, comp: 0 } };
                let processedList = [];

                hotels.forEach(hotel => {
                    let prices = {
                        cleartrip: null,
                        makemytrip: null,
                        yatra: null,
                        tripsure: null
                    };

                    (hotel.priceSummary || []).forEach(sup => {
                        const name = sup.partnerName?.toLowerCase() || "";
                        if (name.includes("cleartrip")) prices.cleartrip = sup.price;
                        else if (name.includes("makemytrip") || name.includes("mmt")) prices.makemytrip = sup.price;
                        else if (name.includes("yatra")) prices.yatra = sup.price;
                        else if (name.includes("tripsure")) prices.tripsure = sup.price;
                    });

                    // Add to supplier counts for coverage pie chart
                    if (prices.cleartrip) suppliers.Cleartrip++;
                    if (prices.makemytrip) suppliers.MakeMyTrip++;
                    if (prices.yatra) suppliers.Yatra++;
                    if (prices.tripsure) suppliers.TripSure++;

                    // Determine single best price for UI cards
                    let bestSupplier = "N/A";
                    let bestPrice = Infinity;
                    
                    Object.entries(prices).forEach(([sup, price]) => {
                        if (price && price < bestPrice) {
                            bestPrice = price;
                            bestSupplier = sup;
                        }
                    });

                    processedList.push({
                        name: hotel.hotelInfo?.name || "Unknown Hotel",
                        rating: hotel.hotelInfo?.starRating || "N/A",
                        location: hotel.hotelInfo?.address || "Unknown Location",
                        image: hotel.hotelInfo?.thumbnailUrl || "https://images.unsplash.com/photo-1566073171526-87e2aa219159?q=80&w=600&auto=format&fit=crop",
                        bestSupplier: bestSupplier,
                        bestPrice: bestPrice === Infinity ? "N/A" : bestPrice,
                        rawPrices: prices // kept for Excel export
                    });

                    // Calculate Cleartrip Win Rate
                    if (prices.cleartrip) {
                        const compPrices = [prices.makemytrip, prices.yatra, prices.tripsure].filter(p => p !== null);
                        if (compPrices.length > 0) {
                            totalValid++;
                            const minComp = Math.min(...compPrices);
                            if (prices.cleartrip <= minComp) ctWins++;

                            // Map to Star Rating
                            const starKey = `${hotel.hotelInfo?.starRating || 3} Star`;
                            if (stars[starKey]) {
                                if (prices.cleartrip <= minComp) stars[starKey].ct++;
                                else stars[starKey].comp++;
                            }
                        }
                    }
                });

                const winRate = totalValid > 0 ? ((ctWins / totalValid) * 100).toFixed(1) : 0;
                
                const pieData = [
                    { name: "Cleartrip", value: suppliers.Cleartrip, color: "#ea580c" },
                    { name: "MakeMyTrip", value: suppliers.MakeMyTrip, color: "#2563eb" },
                    { name: "Yatra", value: suppliers.Yatra, color: "#dc2626" },
                    { name: "TripSure", value: suppliers.TripSure, color: "#16a34a" }
                ].filter(d => d.value > 0);

                const barData = Object.keys(stars).map(key => ({
                    name: key,
                    "CT Win": stars[key].ct,
                    "Comp Win": stars[key].comp
                })).reverse();

                return { ctWinRate: winRate, supplierShare: pieData, starData: barData, parsedHotels: processedList };
            }, [hotels]);

            // EXCEL EXPORT (Connected to backend logic structure natively)
            const exportToExcel = () => {
                if (hotels.length === 0) return;
                // Passes the backend array response directly to the worksheet generator to avoid hard-coded cells
                const flatData = parsedHotels.map(h => ({
                    "Hotel Name": h.name,
                    "Location": h.location,
                    "Star Rating": h.rating,
                    "Cleartrip Price": h.rawPrices.cleartrip || "N/A",
                    "MakeMyTrip Price": h.rawPrices.makemytrip || "N/A",
                    "Yatra Price": h.rawPrices.yatra || "N/A",
                    "TripSure Price": h.rawPrices.tripsure || "N/A",
                }));
                const ws = XLSX.utils.json_to_sheet(flatData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Scraped Prices");
                XLSX.writeFile(wb, `Hotel_Scrape_${city}_${checkIn}.xlsx`);
            };

            // PDF EXPORT
            const exportToPDF = async () => {
                if (!dashboardRef.current) return;
                const canvas = await html2canvas(dashboardRef.current, { scale: 2 });
                const imgData = canvas.toDataURL("image/png");
                const pdf = new window.jspdf.jsPDF("p", "mm", "a4");
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
                pdf.save(`Scrape_Summary_${city}.pdf`);
            };

            return (
                <div className="min-h-screen pb-10">
                    {/* Top Navigation */}
                    <nav className="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <span className="text-orange-600 font-bold text-2xl tracking-tight">iShop</span>
                            <span className="text-gray-500 text-sm ml-4 border-l pl-4 border-gray-300">Reward 360 API Monitor</span>
                        </div>
                    </nav>

                    {/* Search Bar Segment */}
                    <div className="bg-orange-50 border-b border-orange-100 p-6 flex justify-center">
                        <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-2 flex items-center gap-2 w-full max-w-5xl">
                            
                            {/* City Input */}
                            <div className="flex-1 flex items-center px-4 py-2 border-r border-gray-100">
                                <svg className="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <div className="flex flex-col w-full">
                                    <input 
                                        type="text" 
                                        value={city} 
                                        onChange={(e) => setCity(e.target.value)}
                                        className="text-lg font-semibold text-gray-800 focus:outline-none w-full"
                                        placeholder="Enter City"
                                    />
                                    <span className="text-xs text-gray-400">India</span>
                                </div>
                            </div>

                            {/* Check In */}
                            <div className="flex items-center px-4 py-2 border-r border-gray-100 min-w-[160px]">
                                <svg className="w-5 h-5 text-orange-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <div className="flex flex-col w-full">
                                    <input 
                                        type="date" 
                                        value={checkIn}
                                        onChange={handleCheckInChange}
                                        className="font-semibold text-gray-800 text-sm focus:outline-none w-full cursor-pointer"
                                    />
                                    <span className="text-xs text-gray-400">Check-in</span>
                                </div>
                            </div>

                            {/* Check Out (Read-only visually, automatically managed) */}
                            <div className="flex items-center px-4 py-2 border-r border-gray-100 min-w-[160px]">
                                <svg className="w-5 h-5 text-orange-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <div className="flex flex-col w-full">
                                    <input 
                                        type="date" 
                                        value={checkOut}
                                        readOnly
                                        className="font-semibold text-gray-800 text-sm focus:outline-none w-full text-gray-500 bg-transparent"
                                    />
                                    <span className="text-xs text-gray-400">Check-out (Auto)</span>
                                </div>
                            </div>

                            {/* Guests (Locked) */}
                            <div className="flex items-center px-4 py-2 min-w-[160px]">
                                <svg className="w-5 h-5 text-orange-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                <div className="flex flex-col">
                                    <span className="font-semibold text-gray-800 text-sm">2 Guests, 1 Room</span>
                                    <span className="text-xs text-gray-400">Constant</span>
                                </div>
                            </div>

                            {/* Search Button */}
                            <button 
                                onClick={handleSearch}
                                disabled={loading}
                                className="bg-[#ea580c] hover:bg-[#c2410c] text-white font-bold py-3 px-8 rounded-md transition-colors shadow-md disabled:opacity-50 ml-2"
                            >
                                {loading ? 'Searching...' : 'Search'}
                            </button>
                        </div>
                    </div>

                    {/* Loading State */}
                    {loading && (
                        <div className="flex flex-col items-center justify-center mt-20">
                            <div className="spinner mb-4"></div>
                            <p className="text-gray-500">Connecting to Render API & Scraping Properties...</p>
                        </div>
                    )}

                    {/* Error State */}
                    {error && !loading && (
                        <div className="flex flex-col items-center justify-center mt-20 text-center">
                            <img src="https://placehold.co/150x150/f8f9fa/a1a1aa?text=No+Hotels" className="mb-4 opacity-50 grayscale rounded-lg" alt="Not found" />
                            <h3 className="text-xl font-bold text-gray-700">Sorry, Hotels Not Found.</h3>
                            <p className="text-gray-500 mt-2">{error}</p>
                        </div>
                    )}

                    {/* Main Dashboard Workspace */}
                    {!loading && hotels.length > 0 && (
                        <div className="max-w-6xl mx-auto mt-8 px-4" ref={dashboardRef}>
                            
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">{city}, India</h1>
                                    <p className="text-gray-500 text-sm">{hotels.length} properties scraped via live telemetry</p>
                                </div>
                                <div className="flex gap-3" data-html2canvas-ignore="true">
                                    <button onClick={exportToExcel} className="flex items-center text-sm font-semibold bg-green-50 text-green-700 border border-green-200 px-4 py-2 rounded shadow-sm hover:bg-green-100">
                                        📥 Export Excel
                                    </button>
                                    <button onClick={exportToPDF} className="flex items-center text-sm font-semibold bg-blue-50 text-blue-700 border border-blue-200 px-4 py-2 rounded shadow-sm hover:bg-blue-100">
                                        📄 Download PDF
                                    </button>
                                </div>
                            </div>

                            {/* KPI Cards Row */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                
                                {/* CT Win Rate */}
                                <div className="bg-orange-50 border border-orange-100 rounded-xl p-6 flex flex-col items-center justify-center shadow-sm">
                                    <h3 className="text-orange-800 font-bold text-sm tracking-widest uppercase mb-2">Cleartrip Win Rate</h3>
                                    <div className="text-5xl font-black text-gray-900">{ctWinRate}%</div>
                                    <p className="text-orange-600 text-xs mt-3 text-center">Where CT is cheapest vs competitors</p>
                                </div>

                                {/* Star Rating Analysis */}
                                <div className="bg-white border border-gray-200 rounded-xl p-4 shadow-sm h-64">
                                    <h3 className="text-gray-500 font-bold text-xs uppercase tracking-wider mb-2 text-center">Star-Rating Wins</h3>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={starData} layout="vertical" margin={{ top: 5, right: 30, left: 10, bottom: 5 }}>
                                            <XAxis type="number" hide />
                                            {/* Dynamic Axis mapping limited cleanly per instructions */}
                                            <YAxis dataKey="name" type="category" width={50} axisLine={false} tickLine={false} domain={[25, 60]} />
                                            <Tooltip cursor={{fill: '#f8f9fa'}} />
                                            <Legend iconType="circle" wrapperStyle={{fontSize: '11px'}} />
                                            <Bar dataKey="CT Win" stackId="a" fill="#ea580c" barSize={12} radius={[4, 0, 0, 4]} />
                                            <Bar dataKey="Comp Win" stackId="a" fill="#94a3b8" radius={[0, 4, 4, 0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>

                                {/* Supplier Coverage */}
                                <div className="bg-white border border-gray-200 rounded-xl p-4 shadow-sm h-64 flex flex-col items-center justify-center relative">
                                    <h3 className="text-gray-500 font-bold text-xs uppercase tracking-wider absolute top-4">Supplier Coverage</h3>
                                    <ResponsiveContainer width="100%" height="90%">
                                        <PieChart>
                                            <Pie data={supplierShare} innerRadius={50} outerRadius={70} paddingAngle={5} dataKey="value">
                                                {supplierShare.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={entry.color} />
                                                ))}
                                            </Pie>
                                            <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{fontSize: '12px'}} />
                                            <Tooltip />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* Clean Hotel List */}
                            <div className="space-y-4">
                                {parsedHotels.map((hotel, idx) => (
                                    <div key={idx} className="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 shadow-sm hover:shadow-md transition-shadow">
                                        
                                        {/* Generic Image */}
                                        <div className="w-48 h-32 rounded-lg bg-gray-200 overflow-hidden flex-shrink-0">
                                            <img src={hotel.image} alt="hotel" className="w-full h-full object-cover" />
                                        </div>

                                        {/* Details */}
                                        <div className="flex-1 flex justify-between">
                                            <div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded flex items-center gap-1">
                                                        {hotel.rating} <span className="text-yellow-400">★</span>
                                                    </span>
                                                </div>
                                                <h2 className="text-xl font-bold text-gray-900 leading-tight">{hotel.name}</h2>
                                                <div className="text-gray-500 text-sm flex items-center mt-2">
                                                    <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                                    {hotel.location}
                                                </div>
                                            </div>

                                            {/* Single Best Price Focus */}
                                            <div className="flex flex-col items-end justify-center border-l border-gray-100 pl-6 w-48">
                                                <div className="text-xs text-gray-400 font-semibold mb-1 uppercase tracking-wider text-right">Best Price Available</div>
                                                {hotel.bestPrice !== "N/A" ? (
                                                    <>
                                                        <div className="text-2xl font-black text-gray-900">₹{hotel.bestPrice.toLocaleString('en-IN')}</div>
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase mt-2 ${hotel.bestSupplier === 'cleartrip' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                                                            {hotel.bestSupplier}
                                                        </span>
                                                    </>
                                                ) : (
                                                    <span className="text-gray-400 italic">Sold Out</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
