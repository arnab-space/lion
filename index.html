    const [showDropdown, setShowDropdown] = useState(false);
    const [highlightedIdx, setHighlightedIdx] = useState(-1);
    const [dxMode, setDxMode] = useState(2);

    const today = formatDate(new Date());
    const [dates, setDates] = useState({
        dx2: [addDays(today, 1), addDays(today, 2)],
        dx3: [addDays(today, 1), addDays(today, 8), addDays(today, 16)],
        dx4: [addDays(today, 1), addDays(today, 3), addDays(today, 7), addDays(today, 15)]
    });

    const [loading, setLoading] = useState(false);
    const [jobs, setJobs] = useState([]);
    const [doneJobs, setDoneJobs] = useState([]);
    const [currentJobIdx, setCurrentJobIdx] = useState(-1);
    const [activeIdxs, setActiveIdxs] = useState(new Set());
    const [results, setResults] = useState({});
    const [error, setError] = useState(null);
    const [selectedCell, setSelectedCell] = useState(null);
    const [starFilter, setStarFilter] = useState('all');
    const [scope, setScope] = useState('all');
    const [weightMode, setWeightMode] = useState('gmv');
    const [matrixMetric, setMatrixMetric] = useState('winrate');
    const abortRef = useRef(null);

    const MAX_CITIES = 20;
    const activeDates = dxMode === 2 ? dates.dx2 : dxMode === 3 ? dates.dx3 : dates.dx4;

    useEffect(() => {
        const handler = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setShowDropdown(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
    }, []);

    // ─── preset event listeners (top-20 cities, dx-change) ──
    useEffect(() => {
        if (activeMode !== 'bulkdate') return;
        const onCities = (e) => {
            const cs = e.detail?.cities || [];
            setPickedCities(cs.slice(0, MAX_CITIES));
        };
        const onDx = (e) => {
            const dx = e.detail?.dx;
            if ([2,3,4].includes(dx)) setDxMode(dx);
        };
        const onClear = () => {
            setCitySearch("");
            setShowDropdown(true);
            setHighlightedIdx(0);
            setTimeout(() => {
                const inputs = document.querySelectorAll('[data-shortcut="search"]');
                const visible = Array.from(inputs).find(el => el.offsetParent !== null);
                if (visible) visible.focus();
            }, 10);
        };
        const onReset = () => {
            if (abortRef.current) { abortRef.current.abort(); abortRef.current = null; }
            setHasSearched(false); setLoading(false);
            setResults({}); setJobs([]); setDoneJobs([]);
            setCitySearch(""); setPickedCities([]); setError(null); setShowDropdown(false);
            setSelectedCell(null); setActiveIdxs(new Set());
        };
        window.addEventListener('preset-cities', onCities);
        window.addEventListener('preset-dx', onDx);
        window.addEventListener('clear-and-focus-search', onClear);
        window.addEventListener('reset-view', onReset);
        return () => {
            window.removeEventListener('preset-cities', onCities);
            window.removeEventListener('preset-dx', onDx);
            window.removeEventListener('clear-and-focus-search', onClear);
            window.removeEventListener('reset-view', onReset);
        };
    }, [activeMode]);

    const selectCity = (c) => {
        const name = String(c||"");
        if (pickedCities.length < MAX_CITIES && !pickedCities.includes(name)) setPickedCities([...pickedCities, name]);
        setCitySearch(""); // keep dropdown open until esc
    };
    const removeCity = (c) => setPickedCities(pickedCities.filter(x => x !== c));

    const updateDate = (idx, val) => {
        const key = dxMode === 2 ? 'dx2' : dxMode === 3 ? 'dx3' : 'dx4';
        const newArr = [...activeDates];
        newArr[idx] = val;
        setDates({...dates, [key]: newArr});
    };

    const filteredSuggestions = useMemo(() => {
        const q = String(citySearch||"").trim().toLowerCase();
        return (citiesList||[]).filter(c => {
            const ok = q === "" || String(c).toLowerCase().includes(q);
            return ok && !pickedCities.includes(c);
        });
    }, [citiesList, citySearch, pickedCities]);

    const handleSearch = async () => {
        let cities = [...pickedCities];
        const txt = String(citySearch||"").trim();
        if (txt && !pickedCities.includes(txt) && pickedCities.length < MAX_CITIES) cities.push(txt);
        if (!cities.length) { setError("please select at least one destination."); return; }

        onLoadStart();
        setHasSearched(true); setLoading(true); setError(null); setShowDropdown(false);
        setResults({}); setSelectedCell(null);

        abortRef.current = new AbortController();
        const signal = abortRef.current.signal;

        const jobList = [];
        cities.forEach(city => {
            activeDates.forEach(date => {
                jobList.push({ idx: jobList.length, city, date, label: `${city} · ${date.slice(5)}` });
            });
        });
        setJobs(jobList); setDoneJobs([]); setCurrentJobIdx(-1); setActiveIdxs(new Set());

        const worker = async (job, i) => {
            if (signal.aborted) return;
            const { city, date } = job;
            const co = addDays(date, 1);
            setActiveIdxs(prev => { const s = new Set(prev); s.add(i); return s; });
            try {
                const resp = await fetch(`${TUNNEL_URL}/scrape?city=${encodeURIComponent(city)}&checkin=${date}&checkout=${co}`, { signal });
                const data = await resp.json();
                if (data?.status === "success" && Array.isArray(data.hotels)) {
                    const batch = data.hotels.map(h => ({...h, queryCity: city, checkIn: date}));
                    const key = `${city}|${date}`;
                    setResults(prev => ({...prev, [key]: { hotels: batch, count: data.hotels.length }}));
                    setDoneJobs(prev => [...prev, { idx: i, city, date, count: data.hotels.length }]);
                } else {
                    setDoneJobs(prev => [...prev, { idx: i, city, date, count: 0 }]);
                }
            } catch (e) {
                if (e.name !== 'AbortError') console.error(`failed scraping ${city} ${date}`, e);
                setDoneJobs(prev => [...prev, { idx: i, city, date, count: 0, aborted: e.name === 'AbortError' }]);
            } finally {
                setActiveIdxs(prev => { const s = new Set(prev); s.delete(i); return s; });
            }
        };

        await runParallel(jobList, CONCURRENCY, worker);
        setCurrentJobIdx(-1); setLoading(false); onLoadEnd();
        abortRef.current = null;
    };

    // kill-execution listener
    useEffect(() => {
        const onKill = () => {
            if (abortRef.current && activeMode === 'bulkdate') {
                abortRef.current.abort();
                setError('execution killed by user');
                setLoading(false);
            }
        };
        window.addEventListener('kill-execution', onKill);
        return () => window.removeEventListener('kill-execution', onKill);
    }, [activeMode]);

    const heatmap = useMemo(() => {
        if (!pickedCities.length) return null;
        const filterByStar = (hotels) => {
            if (starFilter === 'all') return hotels;
            return hotels.filter(h => Math.floor(Number(h?.hotelInfo?.starRating) || 0) === Number(starFilter));
        };
        const pickValue = (cell) => {
            if (cell.empty) return null;
            return matrixMetric === 'inventory' ? cell.inventoryPct : cell.winRate;
        };
        const rows = pickedCities.map(city => {
            const cells = activeDates.map(date => {
                const key = `${city}|${date}`;
                const r = results[key];
                if (!r || !r.hotels.length) return { city, date, empty: true };
                const filtered = filterByStar(filterByScope(r.hotels, scope, gmvContext.map));
                if (filtered.length === 0) return { city, date, empty: true };
                const m = computeMetrics(filtered, gmvContext.map);
                // inventory = ct-priced hotels / total scraped hotels for this cell (%)
                const ctPriced = m.parsedHotels.filter(h => h.rawPrices.cleartrip !== null).length;
                const inventoryPct = m.parsedHotels.length > 0 ? (ctPriced / m.parsedHotels.length * 100) : 0;
                return {
                    city, date, empty: false,
                    winRate: Number(m.ctWinRate),
                    gmvWinRate: m.gmvWinRate !== null ? Number(m.gmvWinRate) : null,
                    inventoryPct: Number(inventoryPct.toFixed(1)),
                    ctPriced, totalProps: m.parsedHotels.length,
                    count: filtered.length,
                    metrics: m
                };
            });
            const valid = cells.filter(c => !c.empty);
            const rowAvg = valid.length > 0
                ? (valid.reduce((a,c) => a + pickValue(c), 0) / valid.length).toFixed(1)
                : null;
            return { city, cells, rowAvg };
        });
        const colAvgs = activeDates.map((date, di) => {
            const cells = rows.map(r => r.cells[di]).filter(c => !c.empty);
            return cells.length > 0
                ? (cells.reduce((a,c) => a + pickValue(c), 0) / cells.length).toFixed(1)
                : null;
        });
        return { rows, colAvgs };
    }, [pickedCities, activeDates, results, gmvContext.map, starFilter, scope, matrixMetric]);

    // pure monochrome heatmap — pushes contrast wider
    const cellColor = (v) => {
        if (v === null || v === undefined) return '#f8fafc';
        const c = Math.max(0, Math.min(100, v));
        // 98% (very light) at 0% winrate → 15% (near black) at 100% winrate
        return `hsl(0, 0%, ${98 - (c * 0.83)}%)`;
    };
    const cellText = (v) => (v === null || v === undefined) ? '#94a3b8' : (v > 45 ? '#ffffff' : '#0f172a');

    if (activeMode !== 'bulkdate') return null;

    return (
        <div>
            <div className={`transition-all duration-700 w-full max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12 flex flex-col items-center relative ${showDropdown ? 'z-[99999]' : 'z-40'} ${hasSearched ? 'mt-6' : 'min-h-[calc(100vh-120px)] justify-center pb-[5vh]'}`}>
                {!hasSearched && (
                    <div className="text-center mb-6 pointer-events-none animate-float-up">
                        <h1 className="text-4xl md:text-6xl font-black text-slate-800 tracking-tighter mb-2 flex items-center justify-center">dead ser<OrangeISerious />ous</h1>
                        <p className="text-sm font-bold text-slate-500 tracking-widest mt-2">cities × dates matrix scan</p>
                    </div>
                )}

                <div className={`glass-card rounded-3xl flex flex-col gap-3 shadow-xl w-full transition-all duration-500 ${hasSearched ? 'p-2' : 'p-4'}`}>
                    <div className="flex flex-col md:flex-row gap-3">
                        <div className={`flex-1 flex items-center px-4 md:px-5 glass-input rounded-2xl relative w-full transition-all duration-500 ${hasSearched ? 'py-2.5' : 'py-3.5'}`} ref={dropdownRef}>
                            <svg className="w-5 h-5 text-slate-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <div className="flex flex-col w-full relative">
                                {pickedCities.length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mb-1.5 mt-1">
                                        {(expandTags ? pickedCities : pickedCities.slice(0, 4)).map(c => (
                                            <span key={c} className="bg-slate-200 text-slate-700 text-[10px] font-black px-2 py-1 rounded-md flex items-center gap-1 shadow-sm">
                                                {c} <span onClick={(e)=>{e.stopPropagation();removeCity(c);}} className="text-slate-400 hover:text-slate-800 cursor-pointer ml-1 text-xs">×</span>
                                            </span>
                                        ))}
                                        {pickedCities.length > 4 && (
                                            <span onClick={(e)=>{e.stopPropagation();setExpandTags(!expandTags);}} className="bg-slate-100 text-slate-600 text-[10px] font-black px-2 py-1 rounded-md flex items-center shadow-sm cursor-pointer hover:bg-slate-200">
                                                {expandTags ? 'show less' : `+${pickedCities.length-4} more`}
                                            </span>
                                        )}
                                    </div>
                                )}
                                <input type="text"
                                    value={pickedCities.length>=MAX_CITIES ? "" : citySearch}
                                    onChange={(e)=>{setCitySearch(e.target.value.toLowerCase());setShowDropdown(true);setHighlightedIdx(0);}}
                                    onFocus={()=>setShowDropdown(true)}
                                    onKeyDown={(e) => {
                                        if (!showDropdown && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { setShowDropdown(true); return; }
                                        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightedIdx(i => Math.min(i+1, filteredSuggestions.length-1)); }
                                        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightedIdx(i => Math.max(i-1, 0)); }
                                        else if (e.key === 'Enter' && highlightedIdx >= 0 && filteredSuggestions[highlightedIdx]) {
                                            e.preventDefault(); selectCity(filteredSuggestions[highlightedIdx]); setHighlightedIdx(-1);
                                        }
                                        else if (e.key === 'Escape') { e.preventDefault(); setShowDropdown(false); setHighlightedIdx(-1); e.target.blur(); }
                                    }}
                                    data-shortcut="search"
                                    className={`text-base md:text-lg font-bold text-slate-800 bg-transparent focus:outline-none w-full search-input ${pickedCities.length>=MAX_CITIES ? 'hidden' : ''}`}
                                    placeholder={pickedCities.length>=MAX_CITIES ? `max ${MAX_CITIES} cities selected` : hasSearched ? "" : "add destination..."}/>
                                <span className="text-[10px] text-slate-500 font-extrabold tracking-widest mt-0.5">destinations ({pickedCities.length}/{MAX_CITIES})</span>
                                {showDropdown && (
                                    <div className="absolute top-full left-0 mt-3 w-full bg-white/95 backdrop-blur-xl border border-slate-200/80 rounded-2xl shadow-2xl max-h-64 overflow-y-auto z-[99999] py-2">
                                        {filteredSuggestions.length > 0 ? filteredSuggestions.map((item,i) => (
                                            <div key={i}
                                                onClick={(e)=>{e.stopPropagation();selectCity(item);}}
                                                onMouseEnter={()=>setHighlightedIdx(i)}
                                                className={`pl-12 pr-5 py-3 text-sm font-bold cursor-pointer transition-all border-b border-slate-50 last:border-none flex items-center justify-between ${highlightedIdx===i?'bg-slate-100 text-slate-900':'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}`}>
                                                <span>{item}</span>
                                                <span className="text-[10px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">{highlightedIdx===i?'↵':'select'}</span>
                                            </div>
                                        )) : <div className="px-5 py-3 text-sm font-bold text-slate-400 text-center">no matching destinations</div>}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className={`flex items-center px-4 glass-input rounded-2xl w-full md:w-auto transition-all duration-500 ${hasSearched ? 'py-2' : 'py-3.5'}`}>
                            <div className="flex flex-col w-full">
                                <div className="bg-slate-200/60 p-0.5 rounded-lg inline-flex shadow-inner">
                                    <button onClick={()=>setDxMode(2)} className={`px-3 py-1.5 text-xs font-black rounded-md transition-all ${dxMode===2?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}>dx = 2</button>
                                    <button onClick={()=>setDxMode(3)} className={`px-3 py-1.5 text-xs font-black rounded-md transition-all ${dxMode===3?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}>dx = 3</button>
                                    <button onClick={()=>setDxMode(4)} className={`px-3 py-1.5 text-xs font-black rounded-md transition-all ${dxMode===4?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}>dx = 4</button>
                                </div>
                                <span className="text-[10px] text-slate-500 font-extrabold tracking-widest mt-1">check-in dates</span>
                            </div>
                        </div>

                        <button onClick={handleSearch} disabled={loading} data-shortcut="execute" className={`bg-slate-900 hover:bg-slate-800 text-white font-extrabold px-10 rounded-2xl shadow-xl shadow-slate-900/20 transition-all duration-500 disabled:opacity-50 flex items-center justify-center w-full md:w-auto ${hasSearched ? 'py-3' : 'py-4'}`}>
                            {loading ? 'running...' : `execute (${pickedCities.length * activeDates.length} scrapes)`}
                        </button>
                    </div>

                    <div className="flex flex-wrap items-center gap-3 px-2 pt-2 border-t border-slate-100">
                        <span className="text-[10px] font-bold text-slate-400 tracking-widest">dates</span>
                        {activeDates.map((d, i) => (
                            <div key={i} className="flex items-center gap-2 bg-slate-50 rounded-lg px-3 py-1.5 border border-slate-200">
                                <span className="text-[10px] font-black text-slate-500">d{i+1}</span>
                                <input type="date" value={d} onChange={(e)=>updateDate(i, e.target.value)}
                                    className="text-xs font-bold text-slate-800 bg-transparent focus:outline-none"/>
                            </div>
                        ))}
                    </div>
                </div>
            </div>

            {loading && Object.keys(results).length === 0 && (
                <FunLoader done={doneJobs.length} total={jobs.length}/>
            )}

            {error && !loading && (
                <div className="max-w-md mx-auto mt-16 text-center glass-card p-8 rounded-3xl shadow-xl">
                    <div className="bg-slate-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-slate-200 text-3xl">⚠</div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">error</h3>
                    <p className="text-sm text-slate-500 font-medium">{error}</p>
                </div>
            )}

            {hasSearched && heatmap && Object.keys(results).length > 0 && (
                <div className="max-w-[1440px] mx-auto mt-8 px-4 md:px-8 lg:px-12 animate-in fade-in duration-500">
                    {(() => {
                        // aggregate every cell's hotels into one list for the insight strip
                        const allHotels = [];
                        Object.values(results).forEach(r => { if (r?.hotels) allHotels.push(...r.hotels); });
                        const scoped = filterByScope(allHotels, scope, gmvContext.map);
                        const filtered = starFilter === 'all' ? scoped : scoped.filter(h => Math.floor(Number(h?.hotelInfo?.starRating)||0) === Number(starFilter));
                        const aggMetrics = computeMetrics(filtered, gmvContext.map);
                        return aggMetrics && aggMetrics.parsedHotels.length > 0
                            ? <InsightStrip metrics={aggMetrics} gmvContext={gmvContext} weightMode={weightMode} setWeightMode={setWeightMode} scope={scope}/>
                            : null;
                    })()}
                    <div className="mb-6 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                        <div>
                            <h1 className="text-3xl md:text-4xl font-black text-slate-900 tracking-tight mb-2">matrix view</h1>
                            <div className="flex items-center gap-3 flex-wrap">
                                <span className="flex items-center gap-1.5 text-xs font-bold text-slate-700 bg-slate-200/80 px-3 py-1 rounded-full border border-slate-300">
                                    <span className="w-2 h-2 rounded-full bg-slate-800 animate-soft-pulse"></span>
                                    {loading ? `${Object.keys(results).length}/${jobs.length} cells filled` : `${Object.keys(results).length} cells complete`}
                                </span>
                            </div>
                        </div>
                        <div className="flex flex-col md:flex-row md:items-center gap-3">
                            <div className="bg-slate-200/60 p-0.5 rounded-lg inline-flex shadow-inner text-[10px] font-black">
                                {[{k:'winrate',l:'win rate'},{k:'inventory',l:'inventory'}].map(m => (
                                    <button key={m.k} onClick={()=>setMatrixMetric(m.k)}
                                        className={`px-2.5 py-1 rounded-md transition-all ${matrixMetric===m.k?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}>
                                        {m.l}
                                    </button>
                                ))}
                            </div>
                            {gmvContext.status === 'ready' && (
                                <div className="flex items-center gap-1.5">
                                    <span className="text-[10px] font-bold text-slate-400 tracking-widest mr-1">scope</span>
                                    {[{k:'all',l:'all'},{k:'domestic',l:'dom'},{k:'intl',l:'intl'}].map(s => (
                                        <button key={s.k} onClick={()=>setScope(s.k)}
                                            className={`px-2.5 py-1 rounded-md text-[10px] font-bold transition-all ${scope===s.k?'bg-slate-900 text-white':'text-slate-500 hover:text-slate-700 hover:bg-slate-100 border border-slate-200'}`}>
                                            {s.l}
                                        </button>
                                    ))}
                                </div>
                            )}
                            <div className="flex items-center gap-1.5">
                                <span className="text-[10px] font-bold text-slate-400 tracking-widest mr-1">stars</span>
                                {['all','5','4','3','2','1'].map(s => (
                                    <button key={s} onClick={()=>setStarFilter(s)}
                                        className={`px-2.5 py-1 rounded-md text-[10px] font-bold transition-all ${starFilter===s?'bg-slate-900 text-white':'text-slate-500 hover:text-slate-700 hover:bg-slate-100 border border-slate-200'}`}>
                                        {s === 'all' ? 'all' : s+'★'}
                                    </button>
                                ))}
                            </div>
                            <button onClick={() => {
                                // matrix summary sheet
                                const matrixRows = [];
                                heatmap.rows.forEach(row => {
                                    row.cells.forEach((cell, ci) => {
                                        matrixRows.push({
                                            city: row.city,
                                            date: activeDates[ci],
                                            star_filter: starFilter,
                                            properties: cell.empty ? 0 : cell.count,
                                            ct_win_rate_pct: cell.empty ? '' : cell.winRate,
                                            gmv_win_rate_pct: cell.empty || cell.gmvWinRate === null ? '' : cell.gmvWinRate,
                                            gmv_at_risk: cell.empty ? '' : (cell.metrics?.gmvLossSum || 0)
                                        });
                                    });
                                });
                                // detail sheet — every hotel
                                const detailRows = [];
                                Object.entries(results).forEach(([key, r]) => {
                                    const [city, date] = key.split('|');
                                    const scoped = filterByScope(r.hotels, scope, gmvContext.map);
                                    const filtered = starFilter === 'all' ? scoped : scoped.filter(h => Math.floor(Number(h?.hotelInfo?.starRating) || 0) === Number(starFilter));
                                    const m = computeMetrics(filtered, gmvContext.map);
                                    if (!m) return;
                                    m.parsedHotels.forEach(h => {
                                        detailRows.push({
                                            city, date, ct_hid: h.ct_hid, hotel_name: h.name,
                                            star_rating: h.rating,
                                            cleartrip_price: h.rawPrices.cleartrip || '',
                                            makemytrip_price: h.rawPrices.makemytrip || '',
                                            yatra_price: h.rawPrices.yatra || '',
                                            tripsure_price: h.rawPrices.tripsure || '',
                                            best_supplier: h.bestSupplier,
                                            ct_delta_pct: h.ctDelta || '',
                                            gmv_90d: h.gmv || 0,
                                            room_nights_90d: h.nights || 0
                                        });
                                    });
                                });
                                // star breakdown sheet — city × star grid
                                const starRows = [];
                                pickedCities.forEach(city => {
                                    const byStar = { city };
                                    ['5','4','3','2','1'].forEach(star => {
                                        let win = 0, tot = 0;
                                        activeDates.forEach(date => {
                                            const r = results[`${city}|${date}`];
                                            if (!r) return;
                                            const filtered = r.hotels.filter(h => Math.floor(Number(h?.hotelInfo?.starRating) || 0) === Number(star));
                                            if (filtered.length === 0) return;
                                            const m = computeMetrics(filtered, gmvContext.map);
                                            if (m) { win += m.ctWins; tot += m.totalValid; }
                                        });
                                        byStar[`${star}_star_win_pct`] = tot > 0 ? ((win/tot)*100).toFixed(1) : '';
                                        byStar[`${star}_star_n`] = tot;
                                    });
                                    starRows.push(byStar);
                                });

                                const wb = XLSX.utils.book_new();
                                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matrixRows), 'matrix');
                                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailRows), 'hotels');
                                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(starRows), 'by_star');
                                XLSX.writeFile(wb, `matrix_${starFilter}_${formatDate(new Date())}.xlsx`);
                            }} className="glass-card flex items-center text-sm font-bold text-slate-700 px-6 py-3 rounded-2xl hover:bg-white transition-all shadow-sm justify-center">
                                export data (excel)
                            </button>
                        </div>
                    </div>

                    <div className="glass-card rounded-3xl p-4 md:p-6 shadow-xl overflow-x-auto">
                        <table className="w-full min-w-[500px]">
                            <thead>
                                <tr>
                                    <th className="text-left text-[10px] font-black text-slate-400 tracking-widest px-3 py-2">city</th>
                                    {activeDates.map((d, i) => (
                                        <th key={i} className="text-center text-[10px] font-black text-slate-500 tracking-widest px-2 py-2">
                                            <div className="font-black text-slate-700">d{i+1}</div>
                                            <div className="font-bold text-slate-400 text-[9px]">{d.slice(5)}</div>
                                        </th>
                                    ))}
                                    <th className="text-center text-[10px] font-black text-slate-400 tracking-widest px-3 py-2 border-l border-slate-200">avg</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr className="border-b-2 border-slate-200">
                                    <td className="text-[10px] font-black text-slate-500 tracking-widest px-3 py-2 bg-slate-50/60">avg</td>
                                    {heatmap.colAvgs.map((avg, ci) => (
                                        <td key={ci} className="p-1 bg-slate-50/60">
                                            <div className="w-full h-10 rounded-lg flex items-center justify-center bg-white border border-slate-200 shadow-sm">
                                                <span className="text-xs font-black text-slate-800">{avg !== null ? avg + '%' : '—'}</span>
                                            </div>
                                        </td>
                                    ))}
                                    <td className="p-1 border-l border-slate-200 bg-slate-50/60"></td>
                                </tr>
                                {heatmap.rows.map((row, ri) => (
                                    <tr key={ri}>
                                        <td className="text-sm font-bold text-slate-700 px-3 py-1">{row.city}</td>
                                        {row.cells.map((cell, ci) => {
                                            const val = cell.empty ? null : (matrixMetric === 'inventory' ? cell.inventoryPct : cell.winRate);
                                            return (
                                                <td key={ci} className="p-1">
                                                    <button
                                                        onClick={() => !cell.empty && setSelectedCell(cell)}
                                                        disabled={cell.empty}
                                                        className={`heatmap-cell w-full h-14 rounded-lg flex flex-col items-center justify-center transition-all
                                                            ${cell.empty ? 'cursor-not-allowed' : 'cursor-pointer hover:shadow-lg'}`}
                                                        style={{ backgroundColor: cellColor(val), color: cellText(val) }}>
                                                        <div className="text-sm font-black">{val !== null ? val + '%' : '—'}</div>
                                                        <div className="text-[9px] font-bold opacity-70">{cell.count ? cell.count.toLocaleString('en-IN') : 0}</div>
                                                    </button>
                                                </td>
                                            );
                                        })}
                                        <td className="p-1 border-l border-slate-200">
                                            <div className="w-full h-14 rounded-lg flex items-center justify-center bg-slate-50 border border-slate-200">
                                                <span className="text-sm font-black text-slate-700">{row.rowAvg !== null ? row.rowAvg + '%' : '—'}</span>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <InsightModal open={!!selectedCell} onClose={()=>setSelectedCell(null)} title={selectedCell ? `${selectedCell.city} · ${selectedCell.date}` : ''}>
                        {selectedCell && selectedCell.metrics && (() => {
                            const m = selectedCell.metrics;
                            const losses = m.parsedHotels
                                .filter(h => h.bestSupplier !== 'cleartrip' && h.bestSupplier !== 'n/a' && h.rawPrices.cleartrip !== null);
                            const avgLoseMargin = losses.length > 0
                                ? (losses.reduce((a,h) => a + (Number(h.ctDelta) || 0), 0) / losses.length).toFixed(1)
                                : null;
                            const ctPriced = m.parsedHotels.filter(h => h.rawPrices.cleartrip !== null).length;
                            const totalProps = m.parsedHotels.length;
                            const demandWt = gmvContext.totalGmv > 0 ? ((m.gmvViewSum / gmvContext.totalGmv) * 100).toFixed(2) : null;
                            const worst = m.worstCat;
                            return (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        <div className="bg-slate-100 rounded-2xl p-4">
                                            <div className="text-[10px] font-bold text-slate-500 tracking-widest">total properties</div>
                                            <div className="text-xl font-black text-slate-800">{totalProps.toLocaleString('en-IN')}</div>
                                        </div>
                                        <div className="bg-slate-100 rounded-2xl p-4">
                                            <div className="text-[10px] font-bold text-slate-500 tracking-widest">ct inventory</div>
                                            <div className="text-xl font-black text-slate-800">{ctPriced.toLocaleString('en-IN')}<span className="text-xs text-slate-400 font-bold"> / {totalProps.toLocaleString('en-IN')}</span></div>
                                        </div>
                                        <div className="bg-slate-100 rounded-2xl p-4">
                                            <div className="text-[10px] font-bold text-slate-500 tracking-widest">ct win rate</div>
                                            <div className="text-xl font-black text-slate-800">{selectedCell.winRate}%</div>
                                        </div>
                                        {selectedCell.gmvWinRate !== null && (
                                            <div className="bg-slate-100 rounded-2xl p-4">
                                                <div className="text-[10px] font-bold text-slate-500 tracking-widest">gmv win rate</div>
                                                <div className="text-xl font-black text-slate-800">{selectedCell.gmvWinRate}%</div>
                                            </div>
                                        )}
                                        {demandWt !== null && (
                                            <div className="bg-slate-100 rounded-2xl p-4">
                                                <div className="text-[10px] font-bold text-slate-500 tracking-widest">demand weight</div>
                                                <div className="text-xl font-black text-slate-800">{demandWt}%</div>
                                            </div>
                                        )}
                                        {avgLoseMargin !== null && (
                                            <div className="bg-slate-100 rounded-2xl p-4">
                                                <div className="text-[10px] font-bold text-slate-500 tracking-widest">avg lose margin</div>
                                                <div className="text-xl font-black text-slate-800">+{avgLoseMargin}%</div>
                                            </div>
                                        )}
                                        {worst && (
                                            <div className="bg-slate-100 rounded-2xl p-4 md:col-span-2">
                                                <div className="text-[10px] font-bold text-slate-500 tracking-widest">worst category</div>
                                                <div className="text-xl font-black text-slate-800">{worst.name} <span className="text-xs text-slate-500 font-bold">· {worst.gmvWinPct !== null ? worst.gmvWinPct+'% gmv win' : ''}</span></div>
                                            </div>
                                        )}
                                        {m.gmvLossSum > 0 && (
                                            <div className="bg-slate-800 text-white rounded-2xl p-4">
                                                <div className="text-[10px] font-bold text-slate-300 tracking-widest">gmv at risk</div>
                                                <div className="text-xl font-black">{formatCr(m.gmvLossSum)}</div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-4">
                                        <h4 className="text-xs font-black text-slate-500 tracking-widest mb-2">top 10 losses by gmv</h4>
                                        <div className="space-y-1.5 max-h-[40vh] overflow-y-auto">
                                            {losses
                                                .sort((a,b) => (b.gmv||0) - (a.gmv||0))
                                                .slice(0, 10)
                                                .map((h, i) => (
                                                    <div key={i} className="flex items-center gap-3 p-2 bg-slate-50 rounded-lg">
                                                        <span className="text-[10px] font-black text-slate-400 w-5">{i+1}</span>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="text-xs font-bold text-slate-800 truncate">{h.name}</div>
                                                            <div className="text-[9px] font-semibold text-slate-500">★ {h.rating} · +{h.ctDelta}%</div>
                                                        </div>
                                                        {h.hasGmv && <div className="text-[10px] font-black text-slate-700">{formatCr(h.gmv)}</div>}
                                                    </div>
                                                ))}
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                    </InsightModal>
                </div>
            )}
        </div>
    );
};

// ─── DASHBOARD SHELL ─────────────────────────────────────
const DashboardContainer = ({ onLock }) => {
    const [searchMode, setSearchMode] = useState('single');
    const [tabStatus, setTabStatus] = useState({ single:'idle', bulk:'idle', bulkdate:'idle' });
    const gmvContext = React.useContext(GmvContext);

    // ref that always mirrors the current active tab — so onLoadEnd (fired from an
    // async callback) can check which tab is active *at that moment*, not at render time
    const modeRef = useRef(searchMode);
    useEffect(() => { modeRef.current = searchMode; }, [searchMode]);

    // set completion status: if user is still on that tab when the task ends, no tick
    // (they saw it). if they moved away, tick shows until they visit.
    const markComplete = (tab) => {
        setTabStatus(prev => ({
            ...prev,
            [tab]: modeRef.current === tab ? 'idle' : 'completed'
        }));
    };

    const handleTabSwitch = (m) => {
        setSearchMode(m);
        setTabStatus(prev => ({...prev, [m]: prev[m] === 'completed' ? 'idle' : prev[m]}));
    };

    // switch tab via custom event (fires from global shortcut)
    useEffect(() => {
        const onSwitch = (e) => {
            const t = e.detail?.tab;
            if (['single','bulk','bulkdate'].includes(t)) handleTabSwitch(t);
        };
        window.addEventListener('switch-tab', onSwitch);
        return () => window.removeEventListener('switch-tab', onSwitch);
    }, []);

    const tabs = [
        { k: 'single', label: 'single city' },
        { k: 'bulk', label: 'bulk process' },
        { k: 'bulkdate', label: 'bulk × dx', beta: true }
    ];

    return (
        <div className="pb-20 relative min-h-screen">
            <nav className="glass-header sticky top-0 z-[60] px-4 md:px-8 py-4 grid grid-cols-3 items-center shadow-sm border-b border-slate-200/50 gap-4">
                <div className="flex flex-col justify-center min-w-0">
                    <div className="flex items-baseline gap-2 flex-wrap leading-none">
                        <span className="font-black text-2xl md:text-3xl tracking-tighter text-slate-800 flex items-baseline">class mon<OrangeIMonitor />tor</span>
                        <ByCleartrip />
                    </div>
                    <span className="text-slate-500 text-[10px] md:text-[11px] font-bold tracking-widest mt-1.5 lowercase">this <em>cm</em> can improve our <em>cm</em></span>
                </div>

                <div className="flex justify-center">
                    <div className="bg-slate-200/60 p-1 rounded-xl inline-flex shadow-inner backdrop-blur-md">
                        {tabs.map(t => (
                            <button key={t.k} onClick={()=>handleTabSwitch(t.k)}
                                className={`px-4 md:px-5 py-2 text-[11px] md:text-xs font-black rounded-lg transition-all flex items-center gap-1.5 ${searchMode===t.k?'bg-white shadow-md text-slate-800':'text-slate-500 hover:text-slate-700'}`}>
                                {t.label}
                                {t.beta && <span className="text-[8px] font-black bg-slate-200 text-slate-600 px-1 py-[1px] rounded ml-0.5">beta</span>}
                                {tabStatus[t.k]==='loading' && <svg className="animate-spin w-3 h-3 text-slate-400" viewBox="0 0 24 24" fill="none"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg>}
                                {tabStatus[t.k]==='completed' && searchMode!==t.k && <svg className="w-3 h-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg>}
                            </button>
                        ))}
                    </div>
                </div>

                <div className="flex justify-end items-center gap-2">
                    <button onClick={onLock} title="lock session (ctrl+l)"
                        className="text-xs font-bold text-slate-500 hover:text-slate-900 bg-slate-100/80 px-4 py-2 rounded-xl border border-slate-200 shadow-sm transition-all flex items-center gap-1.5">
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        lock
                    </button>
                </div>
            </nav>

            <SearchEngine mode="single" activeMode={searchMode} citiesList={CITIES_LIST}
                onLoadStart={()=>setTabStatus(p=>({...p,single:'loading'}))} onLoadEnd={()=>markComplete('single')}/>
            <SearchEngine mode="bulk" activeMode={searchMode} citiesList={CITIES_LIST}
                onLoadStart={()=>setTabStatus(p=>({...p,bulk:'loading'}))} onLoadEnd={()=>markComplete('bulk')}/>
            <BulkDateEngine activeMode={searchMode} citiesList={CITIES_LIST}
                onLoadStart={()=>setTabStatus(p=>({...p,bulkdate:'loading'}))} onLoadEnd={()=>markComplete('bulkdate')}/>
        </div>
    );
};

// ─── APP ─────────────────────────────────────────────────
const App = () => {
    const [isLocked, setIsLocked] = useState(true);
    const [hasShattered, setHasShattered] = useState(false);
    const [gmvData, setGmvData] = useState({ map: {}, totalGmv: 0, totalGmvDomestic: 0, totalGmvIntl: 0, totalNights: 0, totalNightsDomestic: 0, totalNightsIntl: 0, status: GMV_SHEET_URL ? 'loading' : 'idle', count: 0, countDomestic: 0, countIntl: 0 });

    useEffect(() => {
        if (!GMV_SHEET_URL) return;
        fetch(GMV_SHEET_URL)
            .then(r => r.text())
            .then(text => {
                const rows = parseCSV(text);
                const map = {};
                let totalGmv = 0, totalGmvDomestic = 0, totalGmvIntl = 0;
                let totalNights = 0, totalNightsDomestic = 0, totalNightsIntl = 0;
                let countDomestic = 0, countIntl = 0;
                rows.forEach(r => {
                    const hid = String(r.ct_hids || r.ct_hid || '').trim();
                    if (!hid) return;
                    const gmv = Number(String(r.gmv || 0).replace(/,/g,'')) || 0;
                    const nights = Number(String(r.rn || r.room_nights || 0).replace(/,/g,'')) || 0;
                    const country = String(r.hotelcountry || r.country || '').trim();
                    const isDomestic = country.toLowerCase().includes('india');
                    const cityName = String(r.city_name || r.city || '').trim();
                    map[hid] = { gmv, city: cityName, room_nights: nights, country, isDomestic };
                    totalGmv += gmv; totalNights += nights;
                    if (isDomestic) { totalGmvDomestic += gmv; totalNightsDomestic += nights; countDomestic++; }
                    else { totalGmvIntl += gmv; totalNightsIntl += nights; countIntl++; }
                });
                setGmvData({ map, totalGmv, totalGmvDomestic, totalGmvIntl, totalNights, totalNightsDomestic, totalNightsIntl, status: 'ready', count: Object.keys(map).length, countDomestic, countIntl });
            })
            .catch(err => {
                console.error('gmv load failed', err);
                setGmvData(prev => ({...prev, status: 'error'}));
            });
    }, []);

    const handleUnlock = () => {
        setHasShattered(true);
        setTimeout(() => setIsLocked(false), 700);
    };

    const [showShortcuts, setShowShortcuts] = useState(false);

    // top 20 cities by room-nights demand (from gmv sheet)
    const top20Cities = useMemo(() => {
        const cityRN = {};
        Object.values(gmvData.map).forEach(row => {
            if (!row.city) return;
            const c = String(row.city).toLowerCase().trim();
            if (!c) return;
            cityRN[c] = (cityRN[c] || 0) + (row.room_nights || 0);
        });
        return Object.entries(cityRN)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 20)
            .map(([c]) => c);
    }, [gmvData.map]);

    // dispatch helper for tab switch
    const switchTab = (tab) => window.dispatchEvent(new CustomEvent('switch-tab', { detail: { tab } }));

    // ─── KEYBOARD SHORTCUTS + CHORDS ─────────────────────
    const chordState = useRef({ pending: null, timer: null });

    useEffect(() => {
        const onOpenShortcuts = () => setShowShortcuts(true);
        window.addEventListener('open-shortcuts', onOpenShortcuts);
        return () => window.removeEventListener('open-shortcuts', onOpenShortcuts);
    }, []);

    useEffect(() => {
        const findVisible = (sel) => Array.from(document.querySelectorAll(sel)).find(el => el.offsetParent !== null);
        const startChord = (name, e) => {
            e.preventDefault();
            chordState.current.pending = name;
            if (chordState.current.timer) clearTimeout(chordState.current.timer);
            chordState.current.timer = setTimeout(() => { chordState.current.pending = null; }, 1500);
        };
        const consumeChord = () => {
            const p = chordState.current.pending;
            chordState.current.pending = null;
            if (chordState.current.timer) clearTimeout(chordState.current.timer);
            return p;
        };

        const handler = (e) => {
            if (isLocked) return;
            const tag = document.activeElement?.tagName;
            const inInput = tag === 'INPUT' || tag === 'TEXTAREA';
            const isMeta = e.metaKey || e.ctrlKey;
            const k = e.key.toLowerCase();

            // ── chord second-key: only fire if a chord is pending
            if (chordState.current.pending === 'd') {
                if (k === 'x' || k === 'c' || k === 'v') {
                    e.preventDefault(); consumeChord();
                    const dx = k === 'x' ? 2 : k === 'c' ? 3 : 4;
                    window.dispatchEvent(new CustomEvent('preset-dx', { detail: { dx }}));
                    return;
                }
                consumeChord(); // any other key cancels
            }
            if (chordState.current.pending === 'a') {
                if (k === 'c') {
                    e.preventDefault(); consumeChord();
                    if (top20Cities.length > 0) {
                        window.dispatchEvent(new CustomEvent('preset-cities', { detail: { cities: top20Cities }}));
                    } else {
                        alert('gmv sheet not loaded yet — top 20 preset unavailable');
                    }
                    return;
                }
                consumeChord();
            }

            // ── chord starters (need meta)
            if (isMeta && !e.shiftKey && k === 'd') { startChord('d', e); return; }
            if (isMeta && !e.shiftKey && k === 'a') { startChord('a', e); return; }

            // ── shortcuts modal
            if (isMeta && e.shiftKey && k === 'm') {
                e.preventDefault(); setShowShortcuts(s => !s); return;
            }
            // ── kill in-flight execution
            if (isMeta && e.shiftKey && k === 'x') {
                e.preventDefault();
                window.dispatchEvent(new CustomEvent('kill-execution'));
                return;
            }
            // ── reset current tab to starting screen
            if (isMeta && e.shiftKey && k === 'h') {
                e.preventDefault();
                window.dispatchEvent(new CustomEvent('reset-view'));
                return;
            }

            // ── tab switch (shift+S/B/C) — only when NOT typing in input
            if (!inInput && e.shiftKey && !isMeta) {
                if (k === 's') { e.preventDefault(); switchTab('single'); return; }
                if (k === 'b') { e.preventDefault(); switchTab('bulk'); return; }
                if (k === 'c') { e.preventDefault(); switchTab('bulkdate'); return; }
            }

            // ── lock
            if (isMeta && k === 'l') {
                e.preventDefault();
                setIsLocked(true); setHasShattered(false);
                return;
            }

            // ── execute
            if (isMeta && e.key === 'Enter') {
                e.preventDefault();
                const btn = findVisible('[data-shortcut="execute"]:not([disabled])');
                if (btn) btn.click();
                return;
            }
            // ── focus search — clears any existing text, opens dropdown
            if (isMeta && !e.shiftKey && (k === 's' || k === 'k')) {
                e.preventDefault();
                window.dispatchEvent(new CustomEvent('clear-and-focus-search'));
                return;
            }
            // ── esc (global; local esc handlers on inputs handle the rest)
            if (e.key === 'Escape') {
                if (showShortcuts) { setShowShortcuts(false); return; }
                const el = document.activeElement;
                if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) el.blur();
            }
        };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
    }, [isLocked, top20Cities, showShortcuts]);

    return (
        <GmvContext.Provider value={gmvData}>
            <div className="relative min-h-screen">
                <DashboardContainer onLock={() => { setIsLocked(true); setHasShattered(false); }}/>
                <ShortcutsModal open={showShortcuts} onClose={() => setShowShortcuts(false)}/>
                <div className={`fixed inset-0 z-[999999] bg-slate-50 transition-opacity duration-700 flex items-center justify-center ${isLocked && !hasShattered ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                    {isLocked && <LockScreen onUnlock={handleUnlock}/>}
                </div>
            </div>
        </GmvContext.Provider>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
