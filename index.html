            color: #1e293b;
            text-transform: lowercase;
            user-select: none;
        }
        /* cursors: pointer on interactive elements, text-caret in inputs, no caret only for mpin */

        input[type="date"], input[type="button"], input[type="submit"] { cursor: pointer; }
        .mpin-input { caret-color: transparent !important; }

        /* apple-style glass — layered blur, subtle inner highlight, soft depth shadow */
        .glass-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.8) inset,
                0 0 0 1px rgba(15, 23, 42, 0.02),
                0 8px 32px -8px rgba(15, 23, 42, 0.08),
                0 2px 8px -2px rgba(15, 23, 42, 0.04);
            transition: box-shadow 0.4s var(--ease-out-expo), transform 0.4s var(--ease-out-expo);
        }
        .glass-card:hover { box-shadow:
            0 1px 0 0 rgba(255, 255, 255, 0.9) inset,
            0 0 0 1px rgba(15, 23, 42, 0.03),
            0 16px 48px -12px rgba(15, 23, 42, 0.12),
            0 4px 12px -2px rgba(15, 23, 42, 0.06);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            box-shadow: 0 1px 0 0 rgba(255,255,255,0.8) inset;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.4s var(--ease-out-expo);
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.08), 0 8px 24px -8px rgba(15, 23, 42, 0.12);
            border-color: rgba(15, 23, 42, 0.15);
            transform: translateY(-1px);
        }
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        @keyframes float-up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes soft-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.05); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .animate-float-up { animation: float-up 0.6s var(--ease-out-expo) both; }
        .animate-soft-pulse { animation: soft-pulse 2s var(--ease-in-out-quart) infinite; }

        .price-bar { transition: width 0.6s var(--ease-out-expo); }
        .insight-scroll { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .insight-scroll > * { scroll-snap-align: start; }
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
        }
        .heatmap-cell {
            transition: transform 0.35s var(--ease-out-expo), box-shadow 0.35s var(--ease-out-expo);
        }
        .heatmap-cell:hover { transform: scale(1.06); z-index: 5; box-shadow: 0 8px 24px -6px rgba(15,23,42,0.25); }

        /* smooth all button/link interactions */
        button { transition: all 0.3s var(--ease-out-quart); }
        button:active { transform: scale(0.97); }

            padding: 2px 5px;
            background: rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 4px;
            color: #64748b;
        }
    </style>

// ─── HELPERS ──────────────────────────────────────────────
const formatDate = (date) => {
    const d = new Date(date);
    let m = '' + (d.getMonth() + 1), day = '' + d.getDate();
    const y = d.getFullYear();
    if (m.length < 2) m = '0' + m;
    if (day.length < 2) day = '0' + day;
    return [y, m, day].join('-');
};

const addDays = (dateStr, n) => {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return formatDate(d);
};

const formatINR = (n) => {
    if (n === null || n === undefined || n === "n/a" || isNaN(n)) return "—";
    return "₹" + Number(n).toLocaleString('en-IN');
};

const formatCr = (n) => {
    if (!n || isNaN(n)) return "₹0";
    if (n >= 10000000) return "₹" + (n/10000000).toFixed(2) + " cr";
    if (n >= 100000) return "₹" + (n/100000).toFixed(1) + " l";
    return "₹" + Math.round(n).toLocaleString('en-IN');
};

const parseCSV = (text) => {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const parseLine = (line) => {
        const out = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
                if (inQ && line[i+1] === '"') { cur += '"'; i++; }
                else inQ = !inQ;
            } else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
            else cur += c;
        }
        out.push(cur);
        return out.map(v => v.trim());
    };
    const headers = parseLine(lines[0]).map(h => h.toLowerCase());
    return lines.slice(1).map(line => {
        const vals = parseLine(line);
        const obj = {};
        headers.forEach((h, i) => { obj[h] = vals[i]; });
        return obj;
    });
};

// extract cleartrip hotel id from raw scrape hotel
const extractCtHid = (hotel) => {
    const ps = Array.isArray(hotel?.priceSummary) ? hotel.priceSummary : [];
    const ctP = ps.find(s => s && String(s.partnerName||"").toLowerCase().includes("cleartrip"));
    return ctP?.hotelId ? String(ctP.hotelId) : null;
};

// filter hotels by scope (all | domestic | intl) using gmv map country
const filterByScope = (hotels, scope, gmvMap) => {
    if (scope === 'all' || !hotels) return hotels;
    return hotels.filter(h => {
        const hid = extractCtHid(h);
        if (!hid) return false;
        const g = gmvMap[hid];
        if (!g) return false;
        return scope === 'domestic' ? g.isDomestic : !g.isDomestic;
    });
};

// concurrency-limited parallel runner
const CONCURRENCY = 3;
const runParallel = async (items, concurrency, worker) => {
    const queue = items.map((item, idx) => ({ item, idx }));
    const runners = Array(Math.min(concurrency, queue.length)).fill(null).map(async () => {
        while (queue.length > 0) {
            const next = queue.shift();
            if (!next) return;
            try { await worker(next.item, next.idx); }
            catch (e) { console.error('worker failed', e); }
        }
    });
    await Promise.all(runners);
};

// csv export helper
const downloadCSV = (filename, rows) => {
    if (!rows || rows.length === 0) return;
    const headers = Object.keys(rows[0]);
    const escape = (v) => {
        if (v === null || v === undefined) return '';
        const s = String(v);
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const csv = [headers.join(','), ...rows.map(r => headers.map(h => escape(r[h])).join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
};

    let processedList = [];
    let gmvWinSum = 0, gmvLossSum = 0, gmvPricedSum = 0, gmvViewSum = 0;
    let nightsWinSum = 0, nightsLossSum = 0, nightsPricedSum = 0, nightsViewSum = 0;
    let excludedFromGmv = 0;

    hotels.forEach(hotel => {
        if (!hotel) return;
        const qCity = String(hotel.queryCity || "unknown");
        if (!cStats[qCity]) cStats[qCity] = { totalProps:0, totalValid:0, ctWins:0, gmvWin:0, gmvLoss:0, gmvPriced:0, sups:{cleartrip:0,makemytrip:0,yatra:0,tripsure:0} };
        cStats[qCity].totalProps++;

        let prices = { cleartrip:null, makemytrip:null, yatra:null, tripsure:null };
        const ps = Array.isArray(hotel.priceSummary) ? hotel.priceSummary : [];
        ps.forEach(sup => {
            if (!sup) return;
            const n = String(sup.partnerName || "").toLowerCase();
            const v = Number(sup.price);
            if (!isNaN(v)) {
                if (n.includes("cleartrip")) prices.cleartrip = v;
                else if (n.includes("makemytrip") || n.includes("mmt")) prices.makemytrip = v;
                else if (n.includes("yatra")) prices.yatra = v;
                else if (n.includes("tripsure")) prices.tripsure = v;
            }
        });

        Object.keys(prices).forEach(k => { if (prices[k] !== null) { suppliers[k]++; cStats[qCity].sups[k]++; } });

        let bestSupplier = "n/a", bestPrice = Infinity;
        Object.entries(prices).forEach(([sup, p]) => {
            if (p !== null && p < bestPrice) { bestPrice = p; bestSupplier = sup; }
        });

        let ct_hid = "n/a";
        if (prices.cleartrip !== null) {
            const ctP = ps.find(s => s && String(s.partnerName||"").toLowerCase().includes("cleartrip"));
            if (ctP?.hotelId) ct_hid = String(ctP.hotelId);
        }

        const hInfo = hotel.hotelInfo || {};
        const rawImg = hInfo.image || hInfo.thumbnailUrl || (Array.isArray(hInfo.imagesList) ? hInfo.imagesList[0] : null) || null;

        let ctDelta = null;
        if (prices.cleartrip !== null) {
            const compPrices = [prices.makemytrip, prices.yatra, prices.tripsure].filter(p=>p!==null);
            if (compPrices.length > 0) {
                const minComp = Math.min(...compPrices);
                ctDelta = ((prices.cleartrip - minComp) / minComp * 100).toFixed(1);
            }
        }

        const gmvRow = gmvMap && ct_hid !== "n/a" ? gmvMap[ct_hid] : null;
        const gmv = gmvRow ? Number(gmvRow.gmv) || 0 : 0;
        const nights = gmvRow ? Number(gmvRow.room_nights) || 0 : 0;
        const hasGmv = !!gmvRow;

        if (prices.cleartrip !== null && !hasGmv) excludedFromGmv++;

        processedList.push({
            queryCity: qCity, ct_hid,
            name: String(hInfo.name || "unknown hotel"),
            rating: hInfo.starRating !== undefined ? hInfo.starRating : "n/a",
            location: String(hInfo.address || "unknown location"),
            image: rawImg, bestSupplier,
            bestPrice: bestPrice === Infinity ? "n/a" : bestPrice,
            rawPrices: prices, ctDelta, gmv, nights, hasGmv,
            checkIn: hotel.checkIn || null
        });

        if (prices.cleartrip !== null) {
            totalValid++; cStats[qCity].totalValid++;
            gmvViewSum += gmv; nightsViewSum += nights;

            const compPrices = [prices.makemytrip, prices.yatra, prices.tripsure].filter(p=>p!==null);
            let isWin = compPrices.length === 0 || prices.cleartrip <= Math.min(...compPrices);

            if (isWin) { ctWins++; cStats[qCity].ctWins++; }
            if (hasGmv) {
                gmvPricedSum += gmv; nightsPricedSum += nights;
                cStats[qCity].gmvPriced += gmv;
                if (isWin) { gmvWinSum += gmv; nightsWinSum += nights; cStats[qCity].gmvWin += gmv; }
                else { gmvLossSum += gmv; nightsLossSum += nights; cStats[qCity].gmvLoss += gmv; }
            }

            const rI = Math.floor(Number(hInfo.starRating)||3);
            const sk = rI + " star";
            if (stars[sk]) {
                if (isWin) { stars[sk].ct++; if (hasGmv) stars[sk].gmvCt += gmv; }
                else { stars[sk].comp++; if (hasGmv) stars[sk].gmvComp += gmv; }
            }
        }
    });

    const winRate = totalValid > 0 ? ((ctWins/totalValid)*100).toFixed(1) : 0;
    const gmvWinRate = gmvPricedSum > 0 ? ((gmvWinSum/gmvPricedSum)*100).toFixed(1) : null;
    const nightsWinRate = nightsPricedSum > 0 ? ((nightsWinSum/nightsPricedSum)*100).toFixed(1) : null;

    const supData = Object.entries(suppliers).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
        .map(([n,v]) => ({name:n, value:v, color:SUP_COLORS[n]||'#94a3b8'}));
    const supTotal = supData.reduce((a,c)=>a+c.value,0);
    supData.forEach(d => { d.percent = supTotal > 0 ? ((d.value/supTotal)*100).toFixed(1)+'%' : '0%'; });

    const barData = Object.keys(stars).filter(k=>stars[k].ct>0||stars[k].comp>0).map(k => {
        const {ct,comp,gmvCt,gmvComp} = stars[k]; const tot = ct+comp;
        const gmvTot = gmvCt + gmvComp;
        return {
            name: k, "ct win": ct, "comp win": comp,
            ctPercent: tot > 0 ? ((ct/tot)*100).toFixed(0)+'%' : '',
            gmvWinPct: gmvTot > 0 ? ((gmvCt/gmvTot)*100).toFixed(1) : null,
            gmvLoss: gmvComp
        };
    }).reverse();

    const cStatsArr = Object.entries(cStats).map(([k,s]) => ({
        city: k,
        winRate: s.totalValid > 0 ? ((s.ctWins/s.totalValid)*100).toFixed(1) : 0,
        gmvWinRate: s.gmvPriced > 0 ? ((s.gmvWin/s.gmvPriced)*100).toFixed(1) : null,
        properties: s.totalProps,
        gmvLoss: s.gmvLoss,
        topSup: Object.entries(s.sups).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'none'
    }));

    let worstCat = null;
    barData.forEach(b => {
        if (b.gmvWinPct !== null) {
            if (!worstCat || Number(b.gmvWinPct) < Number(worstCat.gmvWinPct)) worstCat = b;
        }
    });

    return {
        ctWinRate: winRate, gmvWinRate, nightsWinRate,
        supplierShare: supData, starData: barData, parsedHotels: processedList, cityStats: cStatsArr,
        gmvWinSum, gmvLossSum, gmvPricedSum, gmvViewSum,
        nightsWinSum, nightsLossSum, nightsPricedSum, nightsViewSum,
        excludedFromGmv, ctWins, ctLosses: totalValid - ctWins, totalValid,
        worstCat
    };
};

                            })}

                        </div>
                    </div>
                )
            }
        },
        {

            label: 'worst category',

            sub: metrics.worstCat && metrics.worstCat.gmvWinPct !== null ? metrics.worstCat.gmvWinPct + '% gmv win' : 'no data',
            disabled: !metrics.worstCat,
            modal: {
                title: 'category-wise gmv-weighted performance',
                content: (
                    <div className="space-y-2">
                        {metrics.starData.map(b => {
                            const w = b.gmvWinPct !== null ? Number(b.gmvWinPct) : null;

                                    <div className="text-right w-24">

    return (
        <div className="mb-8">
            <div className="flex items-center justify-between mb-3">
                <h3 className="text-xs font-black text-slate-500 tracking-widest">insights</h3>

                    <div className="bg-slate-200/60 p-0.5 rounded-lg inline-flex shadow-inner text-[10px] font-black">
                        {['gmv','nights','unweighted'].map(m => (

                                className={`px-2.5 py-1 rounded-md transition-all ${weightMode===m?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}>
                                {m === 'nights' ? 'room nights' : m}

            <div className="insight-scroll flex gap-3 overflow-x-auto pb-2 -mx-2 px-2">
                {cards.map(card => (
                    <button key={card.key}
                        onClick={() => !card.disabled && setOpenModal(card.key)}
                        disabled={card.disabled}
                        className={`glass-card rounded-2xl p-4 min-w-[180px] flex-shrink-0 text-left transition-all shadow-sm border border-slate-200
                            ${card.disabled ? 'opacity-40 cursor-not-allowed' : 'hover:-translate-y-0.5 hover:shadow-md cursor-pointer'}`}>
                        <div className="text-[9px] font-black text-slate-400 tracking-widest mb-1.5">{card.label}</div>
                        <div className="text-2xl font-black text-slate-900 tracking-tight leading-none">{card.value}</div>
                        <div className="text-[10px] font-bold text-slate-500 mt-1.5">{card.sub}</div>
                    </button>
                ))}
            </div>

            {cards.map(card => (
                <InsightModal key={card.key} open={openModal === card.key} onClose={() => setOpenModal(null)} title={card.modal.title}>
                    {card.modal.content}
                </InsightModal>
            ))}
        </div>
    );
};
// ─── SEARCH ENGINE (single + bulk) ───────────────────────
const SearchEngine = ({ mode, activeMode, citiesList, onLoadStart, onLoadEnd }) => {
    const dropdownRef = useRef(null);
    const gmvContext = React.useContext(GmvContext);

    const defaultCheckIn = new Date();
    defaultCheckIn.setDate(defaultCheckIn.getDate() + 15);
    const defaultCheckOut = new Date(defaultCheckIn);
    defaultCheckOut.setDate(defaultCheckOut.getDate() + 1);

    const [hasSearched, setHasSearched] = useState(false);
    const [citySearch, setCitySearch] = useState("");
    const [lastSearchedCity, setLastSearchedCity] = useState("");
    const [bulkCities, setBulkCities] = useState([]);
    const [expandTags, setExpandTags] = useState(false);
    const [showAllHotels, setShowAllHotels] = useState(false);
    const [expandedCards, setExpandedCards] = useState(new Set());
    const [showDropdown, setShowDropdown] = useState(false);
    const [highlightedIdx, setHighlightedIdx] = useState(-1);
    const [checkIn, setCheckIn] = useState(formatDate(defaultCheckIn));
    const [checkOut, setCheckOut] = useState(formatDate(defaultCheckOut));
    const [loading, setLoading] = useState(false);
    const [jobs, setJobs] = useState([]);
    const [doneJobs, setDoneJobs] = useState([]);
    const [currentJobIdx, setCurrentJobIdx] = useState(-1);
    const [activeIdxs, setActiveIdxs] = useState(new Set());
    const [hotels, setHotels] = useState([]);
    const [totalCount, setTotalCount] = useState(0);
    const [error, setError] = useState(null);
    const [listFilter, setListFilter] = useState('all');
    const [sortBy, setSortBy] = useState('default');
    const [starFilter, setStarFilter] = useState('all');
    const [weightMode, setWeightMode] = useState('gmv');
    const [scope, setScope] = useState('all');
    const [matrixMetric, setMatrixMetric] = useState('winrate');
    const abortRef = useRef(null);

    const MAX_BULK = 25;

    useEffect(() => {
        const handler = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setShowDropdown(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
    }, []);

    // preset event: top-20 cities from gmv (bulk mode only)
    useEffect(() => {
        if (mode !== 'bulk' || activeMode !== 'bulk') return;
        const onCities = (e) => {
            const cs = e.detail?.cities || [];
            setBulkCities(cs.slice(0, MAX_BULK));
        };
        window.addEventListener('preset-cities', onCities);
        return () => window.removeEventListener('preset-cities', onCities);
    }, [mode, activeMode]);

    // clear + focus search (Cmd/Ctrl + K) — only when this tab is active
    useEffect(() => {
        if (activeMode !== mode) return;
        const onClear = () => {
            setCitySearch("");
            setShowDropdown(true);
            setHighlightedIdx(0);
            setTimeout(() => {
                const input = document.querySelector(`.${mode === 'single' ? 'block' : 'block'} [data-shortcut="search"]`);
                // pick the visible one
                const inputs = document.querySelectorAll('[data-shortcut="search"]');
                const visible = Array.from(inputs).find(el => el.offsetParent !== null);
                if (visible) visible.focus();
            }, 10);
        };
        window.addEventListener('clear-and-focus-search', onClear);
        return () => window.removeEventListener('clear-and-focus-search', onClear);
    }, [activeMode, mode]);

    // reset view (Cmd/Ctrl + Shift + H) — back to starting screen
    useEffect(() => {
        if (activeMode !== mode) return;
        const onReset = () => {
            if (abortRef.current) { abortRef.current.abort(); abortRef.current = null; }
            setHasSearched(false); setLoading(false);
            setHotels([]); setTotalCount(0); setJobs([]); setDoneJobs([]);
            setCitySearch(""); setBulkCities([]); setError(null); setShowDropdown(false);
            setShowAllHotels(false); setListFilter('all'); setSortBy('default'); setStarFilter('all');
            setActiveIdxs(new Set());
        };
        window.addEventListener('reset-view', onReset);
        return () => window.removeEventListener('reset-view', onReset);
    }, [activeMode, mode]);

    const selectCity = (c) => {
        const name = String(c||"");
        if (mode === 'single') { setCitySearch(name); setShowDropdown(false); }
        else {
            if (bulkCities.length < MAX_BULK && !bulkCities.includes(name)) setBulkCities([...bulkCities, name]);
            setCitySearch(""); // stay open until esc
        }
    };
    const removeCity = (c) => setBulkCities(bulkCities.filter(x => x !== c));
    const handleCheckInChange = (e) => {
        const v = e.target.value; setCheckIn(v);
        const nd = new Date(v); nd.setDate(nd.getDate()+1); setCheckOut(formatDate(nd));
    };

    const filteredSuggestions = useMemo(() => {
        const q = String(citySearch||"").trim().toLowerCase();
        return (citiesList||[]).filter(c => {
            const ok = q === "" || String(c).toLowerCase().includes(q);
            const notBulk = mode === 'single' || !bulkCities.includes(c);
            return ok && notBulk;
        });
    }, [citiesList, citySearch, mode, bulkCities]);

    const handleSearch = async () => {
        let cities = [];
        const txt = String(citySearch||"").trim();
        if (mode === 'single') { if (txt) { cities = [txt]; setLastSearchedCity(txt); } }
        else {
            cities = [...bulkCities];
            if (txt && !bulkCities.includes(txt) && bulkCities.length < MAX_BULK) cities.push(txt);
        }
        if (!cities.length) { setError("please select at least one destination."); return; }

        onLoadStart();
        setHasSearched(true); setLoading(true); setError(null); setShowDropdown(false);
        setHotels([]); setTotalCount(0); setListFilter('all'); setSortBy('default'); setStarFilter('all');
        setShowAllHotels(false);

        // set up abort controller so global kill-shortcut can stop us mid-run
        abortRef.current = new AbortController();
        const signal = abortRef.current.signal;

        const jobList = cities.map((c,i) => ({ idx:i, city:c, label:c }));
        setJobs(jobList); setDoneJobs([]); setCurrentJobIdx(-1); setActiveIdxs(new Set());

        const worker = async (city, i) => {
            if (signal.aborted) return;
            setActiveIdxs(prev => { const s = new Set(prev); s.add(i); return s; });
            try {
                const resp = await fetch(`${TUNNEL_URL}/scrape?city=${encodeURIComponent(city)}&checkin=${checkIn}&checkout=${checkOut}`, { signal });
                const data = await resp.json();
                if (data?.status === "success" && Array.isArray(data.hotels) && data.hotels.length > 0) {
                    const batch = data.hotels.map(h => ({...h, queryCity: city, checkIn}));
                    setHotels(prev => [...prev, ...batch]);
                    const cnt = (typeof data.total_count === 'number' ? data.total_count : data.hotels.length);
                    setTotalCount(prev => prev + cnt);
                    setDoneJobs(prev => [...prev, { idx: i, city, count: data.hotels.length }]);
                } else {
                    setDoneJobs(prev => [...prev, { idx: i, city, count: 0 }]);
                }
            } catch (e) {
                if (e.name !== 'AbortError') console.error(`failed scraping ${city}`, e);
                setDoneJobs(prev => [...prev, { idx: i, city, count: 0, aborted: e.name === 'AbortError' }]);
            } finally {
                setActiveIdxs(prev => { const s = new Set(prev); s.delete(i); return s; });
            }
        };

        await runParallel(cities, CONCURRENCY, worker);
        setCurrentJobIdx(-1); setLoading(false); onLoadEnd();
        abortRef.current = null;
    };

    // kill-execution event: aborts any in-flight scrape for this engine
    useEffect(() => {
        const onKill = () => {
            if (abortRef.current && activeMode === mode) {
                abortRef.current.abort();
                setError('execution killed by user');
                setLoading(false);
            }
        };
        window.addEventListener('kill-execution', onKill);
        return () => window.removeEventListener('kill-execution', onKill);
    }, [activeMode, mode]);

    // scope filtering (all | domestic | intl based on GMV sheet country)
    const scopedHotels = useMemo(() => filterByScope(hotels, scope, gmvContext.map), [hotels, scope, gmvContext.map]);
    const scopeCounts = useMemo(() => {
        let dom = 0, intl = 0, unmatched = 0;
        hotels.forEach(h => {
            const hid = extractCtHid(h);
            if (!hid) { unmatched++; return; }
            const g = gmvContext.map[hid];
            if (!g) { unmatched++; return; }
            if (g.isDomestic) dom++; else intl++;
        });
        return { all: hotels.length, dom, intl, unmatched };
    }, [hotels, gmvContext.map]);

    const metrics = useMemo(() => computeMetrics(scopedHotels, gmvContext.map), [scopedHotels, gmvContext.map]);

    const exportToExcel = () => {
        if (!metrics || !metrics.parsedHotels.length) return;
        const flat = metrics.parsedHotels.map(h => ({
            query_city: h.queryCity, ct_hid: h.ct_hid, hotel_name: h.name,
            location: h.location, star_rating: h.rating,
            cleartrip_price: h.rawPrices.cleartrip||"n/a",
            makemytrip_price: h.rawPrices.makemytrip||"n/a",
            yatra_price: h.rawPrices.yatra||"n/a",
            tripsure_price: h.rawPrices.tripsure||"n/a",
            best_supplier: h.bestSupplier, ct_delta_pct: h.ctDelta||"n/a",
            gmv_90d: h.gmv || "n/a", room_nights_90d: h.nights || "n/a"
        }));
        const ws = XLSX.utils.json_to_sheet(flat);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "scrape_data");
        XLSX.writeFile(wb, `telemetry_${mode}_${checkIn}.xlsx`);
    };

    const displayedHotels = useMemo(() => {
        if (!metrics) return [];
        let list = listFilter === 'all' ? [...metrics.parsedHotels] : metrics.parsedHotels.filter(h => h.queryCity === listFilter);
        if (starFilter !== 'all') list = list.filter(h => Math.floor(Number(h.rating)||0) === Number(starFilter));

        if (sortBy === 'default') {
            list.sort((a,b) => {
                const aL = (a.bestSupplier !== 'cleartrip' && a.bestSupplier !== 'n/a') ? (a.gmv || 0) : -1;
                const bL = (b.bestSupplier !== 'cleartrip' && b.bestSupplier !== 'n/a') ? (b.gmv || 0) : -1;
                return bL - aL;
            });
        }
        else if (sortBy === 'price-asc') list.sort((a,b) => (a.bestPrice==="n/a"?Infinity:a.bestPrice)-(b.bestPrice==="n/a"?Infinity:b.bestPrice));
        else if (sortBy === 'price-desc') list.sort((a,b) => (b.bestPrice==="n/a"?-Infinity:b.bestPrice)-(a.bestPrice==="n/a"?-Infinity:a.bestPrice));
        else if (sortBy === 'stars') list.sort((a,b) => (Number(b.rating)||0)-(Number(a.rating)||0));
        else if (sortBy === 'gmv') list.sort((a,b) => (b.gmv||0) - (a.gmv||0));
        else if (sortBy === 'ct-wins') list.sort((a,b) => (a.bestSupplier==='cleartrip'?0:1)-(b.bestSupplier==='cleartrip'?0:1));
        else if (sortBy === 'ct-losses') list.sort((a,b) => (a.bestSupplier!=='cleartrip'&&a.bestSupplier!=='n/a'?0:1)-(b.bestSupplier!=='cleartrip'&&b.bestSupplier!=='n/a'?0:1));
        return list;
    }, [metrics, listFilter, sortBy, starFilter]);

    const peekHotels = showAllHotels ? displayedHotels : displayedHotels.slice(0, 6);

    return (
        <div className={activeMode === mode ? 'block' : 'hidden'}>
            <div className={`transition-all duration-700 ease-in-out w-full max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12 flex flex-col items-center relative ${showDropdown ? 'z-[99999]' : 'z-40'} ${hasSearched ? 'mt-6' : 'min-h-[calc(100vh-120px)] justify-center pb-[5vh]'}`}>
                <div className={`w-full flex flex-col items-center transition-all duration-700 ${hasSearched ? 'mb-4' : 'mb-8'}`}>
                    {!hasSearched && (
                        <div className="text-center mb-6 pointer-events-none animate-float-up">
                            {mode === 'single' ? (
                                <h1 className="text-4xl md:text-6xl font-black text-slate-800 tracking-tighter mb-2 flex items-center justify-center">why so ser<OrangeISerious />ous?</h1>
                            ) : (
                                <h1 className="text-4xl md:text-6xl font-black text-slate-800 tracking-tighter mb-2 flex items-center justify-center">now we're ser<OrangeISerious />ous</h1>
                            )}
                            <p className="text-sm font-bold text-slate-500 tracking-widest mt-2">always at your service (24*7)</p>
                        </div>
                    )}
                </div>

                <div className={`glass-card rounded-3xl flex flex-col md:flex-row items-center gap-3 shadow-xl w-full transition-all duration-500 ${hasSearched ? 'p-2' : 'p-3'}`}>
                    <div className={`flex-1 flex items-center px-4 md:px-5 glass-input rounded-2xl relative w-full transition-all duration-500 ${hasSearched ? 'py-2.5' : 'py-3.5'}`} ref={dropdownRef}>
                        <svg className="w-5 h-5 text-slate-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <div className="flex flex-col w-full relative">
                            {mode === 'bulk' && bulkCities.length > 0 && (
                                <div className={`flex flex-wrap items-center transition-all ${hasSearched ? 'gap-1.5 mb-1 mt-0' : 'mb-1.5 mt-1 gap-1.5'}`}>

                                        <span key={c} className={`bg-slate-200 text-slate-800 font-black rounded-lg flex items-center gap-1 shadow-sm transition-all ${hasSearched ? 'text-sm px-3 py-1.5' : 'text-[10px] px-2 py-1'}`}>
                                            {c} <span onClick={(e)=>{e.stopPropagation();removeCity(c);}} className={`text-slate-400 hover:text-slate-800 cursor-pointer leading-none ${hasSearched ? 'text-sm ml-1' : 'text-[10px] ml-0.5'}`}>×</span>

                            <input type="text"

                                onChange={(e)=>{setCitySearch(e.target.value.toLowerCase());setShowDropdown(true);setHighlightedIdx(0);}}
                                onFocus={()=>setShowDropdown(true)}
                                onKeyDown={(e) => {
                                    if (!showDropdown && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { setShowDropdown(true); return; }
                                    if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightedIdx(i => Math.min(i+1, filteredSuggestions.length-1)); }
                                    else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightedIdx(i => Math.max(i-1, 0)); }
                                    else if (e.key === 'Enter' && highlightedIdx >= 0 && filteredSuggestions[highlightedIdx]) {
                                        e.preventDefault(); selectCity(filteredSuggestions[highlightedIdx]); setHighlightedIdx(-1);
                                    }
                                    else if (e.key === 'Escape') { e.preventDefault(); setShowDropdown(false); setHighlightedIdx(-1); e.target.blur(); }
                                }}
                                data-shortcut="search"
                                className={`font-bold text-slate-800 bg-transparent focus:outline-none w-full search-input transition-all ${hasSearched ? 'text-xs' : 'text-base md:text-lg'} ${mode==='bulk' && bulkCities.length>=MAX_BULK ? 'hidden' : ''}`}
                                placeholder={hasSearched ? (mode === 'bulk' ? "+ add more..." : "") : (mode==='single' ? "search destination..." : (bulkCities.length>=MAX_BULK ? `max ${MAX_BULK} cities selected` : "add destination..."))}/>
                            {!hasSearched && (
                                <span className="text-slate-500 font-extrabold tracking-widest text-[10px] mt-0.5">destination{mode==='bulk'?`s (${bulkCities.length}/${MAX_BULK})`:''}</span>
                            )}
                            {showDropdown && (
                                <div className="absolute top-full left-0 mt-3 w-full bg-white/95 backdrop-blur-xl border border-slate-200/80 rounded-2xl shadow-2xl max-h-64 overflow-y-auto z-[99999] py-2">
                                    {filteredSuggestions.length > 0 ? filteredSuggestions.map((item,i) => (
                                        <div key={i}
                                            onClick={(e)=>{e.stopPropagation();selectCity(item);}}
                                            onMouseEnter={()=>setHighlightedIdx(i)}
                                            className={`pl-12 pr-5 py-3 text-sm font-bold cursor-pointer transition-all border-b border-slate-50 last:border-none flex items-center justify-between ${highlightedIdx===i?'bg-slate-100 text-slate-900':'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}`}>
                                            <span>{item}</span>

                                        </div>
                                    )) : <div className="px-5 py-3 text-sm font-bold text-slate-400 text-center">no matching destinations</div>}

                        {loading ? 'running...' : 'execute'}
                    </button>
                </div>
            </div>

            {loading && hotels.length === 0 && (
                <FunLoader done={doneJobs.length} total={jobs.length}/>
            )}
