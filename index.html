    <style>
        * {
            caret-color: transparent; 
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210,40%,90%,0.3) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(210,40%,96%,0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(210,40%,90%,0.2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(210,40%,96%,0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            text-transform: lowercase;
            user-select: none;
        }
        input, button, select {
            cursor: pointer;
        }
        input[type="text"] {
            user-select: auto;
        }
        .search-input {
            caret-color: #1e293b !important; 
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.1);
            border-color: rgba(15, 23, 42, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, Legend, ResponsiveContainer, Cell, LabelList } = window.Recharts;

        const DEFAULT_CITIES = [
            "kolkata", "mumbai", "delhi", "bengaluru", "chennai", "hyderabad", "pune", 
            "ahmedabad", "jaipur", "goa", "dubai", "new york", "singapore", "bangkok", 
            "london", "gurgaon", "noida", "chandigarh", "kochi", "varanasi", "agra",

        const CITY_STATES = {
            "kolkata": "west bengal", "mumbai": "maharashtra", "delhi": "delhi",
            "bengaluru": "karnataka", "chennai": "tamil nadu", "hyderabad": "telangana",
            "pune": "maharashtra", "ahmedabad": "gujarat", "jaipur": "rajasthan",
            "goa": "goa", "dubai": "uae", "new york": "new york", "singapore": "singapore",
            "bangkok": "thailand", "london": "england", "gurgaon": "haryana",
            "noida": "uttar pradesh", "chandigarh": "chandigarh", "kochi": "kerala",
            "varanasi": "uttar pradesh", "agra": "uttar pradesh", "amritsar": "punjab",
            "shimla": "himachal pradesh", "manali": "himachal pradesh", "ooty": "tamil nadu",
            "mysuru": "karnataka", "patna": "bihar", "bhopal": "madhya pradesh",
            "indore": "madhya pradesh", "lucknow": "uttar pradesh", "surat": "gujarat",
            "nagpur": "maharashtra", "visakhapatnam": "andhra pradesh", "vadodara": "gujarat",
            "coimbatore": "tamil nadu"

        const SUP_COLORS = {
            cleartrip: "#0f172a",
            makemytrip: "#475569",
            yatra: "#94a3b8",
            tripsure: "#cbd5e1"
        };

        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };

        const renderCustomBarLabel = (props) => {
            const { x, y, width, height, value } = props;
            if (!value) return null;
            return (
                <text x={x + width + 8} y={y + height / 2} fill="#64748b" fontSize={10} fontWeight={700} dy={3} textAnchor="start">
                    {value}
                </text>
            );
        };

        // Serious dot (Preserved styling)
        const OrangeISerious = () => (
            <span className="relative inline-block leading-none text-slate-900 mx-[1px]">
                ı
                <span className="absolute bg-orange-500 rounded-full" style={{ width: '0.20em', height: '0.20em', top: '0.10em', left: '3px', right: '2px', margin: 'auto' }}></span>
            </span>
        );

        // Monitor dot (New precise styling)
        const OrangeIMonitor = () => (
            <span className="relative inline-block leading-none text-slate-900 mx-[1px]">
                ı
                <span className="absolute bg-orange-500 rounded-full" style={{ width: '0.2em', height: '0.2em', top: '0.04em', left: '1px', right: '2px', margin: 'auto' }}></span>
            </span>
        );

        const ByCleartrip = () => (
            <div className="flex items-center gap-1 opacity-60">
                <span className="text-[11px] font-bold text-slate-500 tracking-wider">by</span>
                <div className="flex items-center">
                    <svg viewBox="0 0 100 100" className="w-3.5 h-3.5 text-slate-500 mr-0.5" fill="currentColor">
                        <path d="M25,10 C15,10 10,15 10,25 L10,75 C10,85 15,90 25,90 L75,90 C85,90 90,85 90,75 L90,25 C90,15 85,10 75,10 Z M45,70 L25,50 L35,40 L45,50 L75,20 L85,30 Z"/>
                    </svg>
                    <span className="text-[12px] font-black text-slate-500 tracking-tighter" style={{ fontFamily: 'Helvetica, Arial, sans-serif' }}>cleartrip</span>
                </div>
            </div>
        );

        const FunLoader = ({ progress }) => (
            <div className="w-full flex flex-col items-center justify-center py-24 animate-in fade-in duration-500">
                <div className="relative w-20 h-20 mb-8 grayscale opacity-80">
                    <div className="absolute inset-0 bg-slate-300 rounded-full animate-ping opacity-75"></div>
                    <div className="absolute inset-2 bg-slate-200 rounded-full animate-pulse"></div>
                    <div className="absolute inset-0 flex items-center justify-center">
                        <span className="inline-block text-3xl">🕵️‍♂️</span>
                    </div>
                </div>
                {progress ? (
                    <h3 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight mb-2">
                        snooping around {progress.city} ({progress.current}/{progress.total})...
                    </h3>
                ) : (
                    <h3 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight mb-2">snooping around...</h3>
                )}
                <p className="text-sm font-bold text-slate-500 max-w-sm text-center leading-relaxed">bribing receptionists, comparing suppliers, and hunting down the best secret rates.</p>
            </div>
        );

        const LockScreen = ({ onUnlock }) => {
            const [mpin, setMpin] = useState("");
            const [authError, setAuthError] = useState(false);
            const [isShaking, setIsShaking] = useState(false);
            const [isShattering, setIsShattering] = useState(false);

            useEffect(() => {
                if (mpin.length === 4) {
                    if (mpin === "2141" || mpin === "7003") {
                        setIsShattering(true);
                        const timer = setTimeout(() => {
                            onUnlock();
                        }, 700); 
                        return () => clearTimeout(timer);
                    } else {
                        setAuthError(true);
                        setIsShaking(true);
                        const timer = setTimeout(() => {
                            setMpin("");
                            setIsShaking(false);
                        }, 400);
                        return () => clearTimeout(timer);
                    }
                } else {
                    setAuthError(false);
                }
            }, [mpin, onUnlock]);

            const handleMpinChange = (e) => {
                const val = e.target.value;
                setMpin(val.replace(/\D/g, "").slice(0, 4));
            };

            return (
                <>
                    {/* Error Background Gradient behind the lock card */}
                    <div 
                        className={`fixed inset-0 pointer-events-none transition-opacity duration-300 z-0 ${isShaking ? 'opacity-100' : 'opacity-0'}`} 
                        style={{ background: 'radial-gradient(circle at center, rgba(254, 202, 202, 0.7) 0%, rgba(254, 226, 226, 0.2) 60%, transparent 100%)' }}
                    />
                    
                    <div className={`bg-white/95 backdrop-blur-3xl p-8 md:p-12 rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.15)] border border-white max-w-sm w-full text-center transition-all duration-700 pointer-events-auto relative overflow-hidden z-10 ${isShattering ? 'scale-125 opacity-0 filter blur-xl brightness-150' : 'scale-100 opacity-100 filter blur-0 brightness-100'} ${isShaking ? 'animate-shake' : ''}`}>
                        
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none mix-blend-overlay z-0">
                            <g style={{ opacity: 0.6 }}>
                                <path d="M50,70 L20,0 L0,10" stroke="#000" strokeWidth="0.3" fill="none" strokeDasharray="150" strokeDashoffset={mpin.length >= 1 ? 0 : 150} style={{ transition: 'stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1)' }}/>
                                <path d="M50,70 L85,0 L100,10" stroke="#fff" strokeWidth="0.5" fill="none" strokeDasharray="150" strokeDashoffset={mpin.length >= 1 ? 0 : 150} style={{ transition: 'stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1)' }}/>
                                <path d="M50,70 L100,50 L100,60" stroke="#000" strokeWidth="0.4" fill="none" strokeDasharray="150" strokeDashoffset={mpin.length >= 2 ? 0 : 150} style={{ transition: 'stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1)' }}/>
                                <path d="M30,30 L0,50" stroke="#fff" strokeWidth="0.6" fill="none" strokeDasharray="150" strokeDashoffset={mpin.length >= 2 ? 0 : 150} style={{ transition: 'stroke-dashoffset 0.3s cubic-bezier(0.4, 0, 0.2, 1)' }}/>
                                <path d="M50,70 L20,100" stroke="#fff" strokeWidth="0.7" fill="none" strokeDasharray="150" strokeDashoffset={mpin.length >= 3 ? 0 : 150} style={{ transition: 'stroke-dashoffset 0.2s cubic-bezier(0.4, 0, 0.2, 1)' }}/>
                                <path d="M70,80 L100,100" stroke="#000" strokeWidth="0.5" fill="none" strokeDasharray="150" strokeDashoffset={mpin.length >= 3 ? 0 : 150} style={{ transition: 'stroke-dashoffset 0.3s cubic-bezier(0.4, 0, 0.2, 1)' }}/>
                            </g>
                        </svg>

                        <div className="relative z-10 flex flex-col items-center">
                            <div className="flex flex-col items-center justify-center mb-6">
                                <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center mb-2 border border-slate-200">
                                    <svg className="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                </div>
                                <span className="text-[10px] font-bold text-slate-500 tracking-widest lowercase">session locked</span>
                            </div>

                            <h2 className="text-3xl font-black text-slate-900 tracking-tight leading-none mb-1">
                                class mon<OrangeIMonitor />tor
                            </h2>
                            <div className="mb-2 mt-1">
                                <ByCleartrip />
                            </div>
                            <p className="text-[10px] font-bold text-slate-500 lowercase tracking-widest mb-8">this <em>cm</em> can improve our <em>cm</em></p>
                            
                            <div className="space-y-2 relative mx-auto w-4/5 mt-2">
                                <div className="relative w-full h-12 border border-slate-200 bg-white/50 rounded-xl overflow-hidden shadow-sm transition-colors focus-within:border-slate-400 focus-within:bg-white">
                                    <input 
                                        type="text" 
                                        inputMode="numeric"
                                        maxLength="4" 
                                        value={mpin} 
                                        onChange={handleMpinChange}
                                        autoFocus
                                        className="absolute inset-0 w-full h-full text-transparent bg-transparent focus:outline-none z-10 caret-transparent"
                                    />
                                    <div className="absolute inset-0 flex items-center justify-center gap-3 pointer-events-none z-0">
                                        {[0, 1, 2, 3].map((idx) => (
                                            <span key={idx} className={`text-4xl font-black mt-3 flex items-center justify-center h-full transition-all duration-200 ${idx < mpin.length ? 'text-slate-900 scale-110' : 'text-slate-300 scale-100'}`}>
                                                *
                                            </span>
                                        ))}
                                    </div>
                                </div>
                                <div className="h-4 mt-2">
                                    {authError && <p className="text-[10px] font-bold text-slate-600 animate-in fade-in slide-in-from-bottom-1">invalid mpin. please try again.</p>}
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        const SearchEngine = ({ mode, activeMode, setMode, citiesList, onLoadStart, onLoadEnd }) => {
            const dropdownRef = useRef(null);
            
            const defaultCheckIn = new Date();
            defaultCheckIn.setDate(defaultCheckIn.getDate() + 15);
            const defaultCheckOut = new Date(defaultCheckIn);
            defaultCheckOut.setDate(defaultCheckOut.getDate() + 1);

            const [hasSearched, setHasSearched] = useState(false);
            const [citySearch, setCitySearch] = useState("");
            const [lastSearchedCity, setLastSearchedCity] = useState("");
            const [bulkCities, setBulkCities] = useState([]);
            const [expandTags, setExpandTags] = useState(false);
            const [showListings, setShowListings] = useState(false);
            
            const [showDropdown, setShowDropdown] = useState(false);
            const [checkIn, setCheckIn] = useState(formatDate(defaultCheckIn));
            const [checkOut, setCheckOut] = useState(formatDate(defaultCheckOut));
            
            const [loading, setLoading] = useState(false);
            const [scrapeProgress, setScrapeProgress] = useState(null);
            const [hotels, setHotels] = useState([]);
            const [error, setError] = useState(null);
            const [listFilter, setListFilter] = useState('all');

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setShowDropdown(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const selectCity = (selectedCity) => {
                if (mode === 'single') {
                    setCitySearch(selectedCity);
                    setShowDropdown(false);
                } else {
                    if (bulkCities.length < 10 && !bulkCities.includes(selectedCity)) {
                        setBulkCities([...bulkCities, selectedCity]);
                    }
                    setCitySearch("");
                    setShowDropdown(false);
                }
            };

            const removeCity = (cityToRemove) => {
                setBulkCities(bulkCities.filter(c => c !== cityToRemove));
            };

            const handleCheckInChange = (e) => {
                const newCheckInDate = e.target.value;
                setCheckIn(newCheckInDate);
                const nextDay = new Date(newCheckInDate);
                nextDay.setDate(nextDay.getDate() + 1);
                setCheckOut(formatDate(nextDay));
            };

            const filteredSuggestions = useMemo(() => {
                const query = citySearch.trim().toLowerCase();
                return citiesList.filter(c => {
                    const matches = query === "" || c.includes(query);
                    const notInBulk = mode === 'single' || !bulkCities.includes(c);
                    return matches && notInBulk;
                });
            }, [citiesList, citySearch, mode, bulkCities]);

            const handleSearch = async () => {
                let citiesToProcess = [];
                if (mode === 'single') {
                    if (citySearch.trim().length > 0) {
                        citiesToProcess = [citySearch.trim()];
                        setLastSearchedCity(citySearch.trim());
                    }
                } else {
                    citiesToProcess = [...bulkCities];
                    if (citySearch.trim().length > 0 && !bulkCities.includes(citySearch.trim()) && bulkCities.length < 10) {
                        citiesToProcess.push(citySearch.trim());
                    }
                }

                if (citiesToProcess.length === 0) {
                    setError("please select or type at least one destination.");
                    return;
                }

                onLoadStart();
                setHasSearched(true);
                setLoading(true);
                setError(null);
                setShowDropdown(false);
                setHotels([]); 
                setListFilter('all');
                setShowListings(false);
                
                let allResults = [];
                const TUNNEL_URL = "https://class-monitor-459075732709.asia-east2.run.app/";

                for (let i = 0; i < citiesToProcess.length; i++) {
                    const currentCity = citiesToProcess[i];
                    if (mode === 'bulk') {
                        setScrapeProgress({ current: i + 1, total: citiesToProcess.length, city: currentCity });
                    }
                    
                    try {
                        const response = await fetch(`${TUNNEL_URL}/scrape?city=${currentCity}&checkin=${checkIn}&checkout=${checkOut}`);
                        const data = await response.json();
                        
                        if (data.status === "success" && data.hotels && data.hotels.length > 0) {
                            const tagged = data.hotels.map(h => ({ ...h, queryCity: currentCity }));
                            allResults = [...allResults, ...tagged];
                        }
                    } catch (err) {
                        console.error(`failed scraping ${currentCity}`);
                    }
                }

                if (allResults.length > 0) {
                    setHotels(allResults);
                } else {
                    setError("website returned 0 properties. check proxy or session state.");
                }
                
                setLoading(false);
                setScrapeProgress(null);
                onLoadEnd();
            };

            const { ctWinRate, supplierShare, starData, parsedHotels, cityStats } = useMemo(() => {
                if (!hotels || hotels.length === 0) return { ctWinRate: 0, supplierShare: [], starData: [], parsedHotels: [], cityStats: [] };

                let ctWins = 0, totalValid = 0;
                let suppliers = { cleartrip: 0, makemytrip: 0, yatra: 0, tripsure: 0 };
                let stars = { "5 star": { ct: 0, comp: 0 }, "4 star": { ct: 0, comp: 0 }, "3 star": { ct: 0, comp: 0 }, "2 star": { ct: 0, comp: 0 }, "1 star": { ct: 0, comp: 0 }, "0 star": { ct: 0, comp: 0 } };
                
                let cStats = {};
                let processedList = [];

                hotels.forEach(hotel => {
                    const qCity = hotel.queryCity || "unknown";
                    if (!cStats[qCity]) {
                        cStats[qCity] = { totalProps: 0, totalValid: 0, ctWins: 0, sups: { cleartrip: 0, makemytrip: 0, yatra: 0, tripsure: 0 } };
                    }
                    cStats[qCity].totalProps++;

                    let prices = { cleartrip: null, makemytrip: null, yatra: null, tripsure: null };

                    (hotel.priceSummary || []).forEach(sup => {
                        const name = sup.partnerName?.toLowerCase() || "";
                        if (name.includes("cleartrip")) prices.cleartrip = sup.price;
                        else if (name.includes("makemytrip") || name.includes("mmt")) prices.makemytrip = sup.price;
                        else if (name.includes("yatra")) prices.yatra = sup.price;
                        else if (name.includes("tripsure")) prices.tripsure = sup.price;
                    });

                    if (prices.cleartrip) { suppliers.cleartrip++; cStats[qCity].sups.cleartrip++; }
                    if (prices.makemytrip) { suppliers.makemytrip++; cStats[qCity].sups.makemytrip++; }
                    if (prices.yatra) { suppliers.yatra++; cStats[qCity].sups.yatra++; }
                    if (prices.tripsure) { suppliers.tripsure++; cStats[qCity].sups.tripsure++; }

                    let bestSupplier = "n/a";
                    let bestPrice = Infinity;
                    
                    Object.entries(prices).forEach(([sup, price]) => {
                        if (price && price < bestPrice) {
                            bestPrice = price;
                            bestSupplier = sup;
                        }
                    });

                    let ct_hid = "n/a";
                    if (prices.cleartrip !== null && prices.cleartrip !== undefined) {
                        const ctPartner = (hotel.priceSummary || []).find(sup => sup.partnerName?.toLowerCase().includes("cleartrip"));
                        if (ctPartner && ctPartner.hotelId) {
                            ct_hid = ctPartner.hotelId;
                        }
                    }

                    const rawImg = hotel.hotelInfo?.image || hotel.hotelInfo?.thumbnailUrl || (Array.isArray(hotel.hotelInfo?.imagesList) ? hotel.hotelInfo.imagesList[0] : null) || null;

                    processedList.push({
                        queryCity: qCity,
                        ct_hid,
                        name: hotel.hotelInfo?.name || "unknown hotel",
                        rating: hotel.hotelInfo?.starRating || "n/a",
                        location: hotel.hotelInfo?.address || "unknown location",
                        image: rawImg,
                        bestSupplier,
                        bestPrice: bestPrice === Infinity ? "n/a" : bestPrice,
                        rawPrices: prices
                    });

                    if (prices.cleartrip) {
                        const compPrices = [prices.makemytrip, prices.yatra, prices.tripsure].filter(p => p !== null);
                        if (compPrices.length > 0) {
                            totalValid++;
                            cStats[qCity].totalValid++;
                            
                            const minComp = Math.min(...compPrices);
                            if (prices.cleartrip <= minComp) {
                                ctWins++;
                                cStats[qCity].ctWins++;
                            }

                            const ratingInt = Math.floor(hotel.hotelInfo?.starRating || 3);
                            const starKey = `${ratingInt} star`;
                            if (stars[starKey]) {
                                if (prices.cleartrip <= minComp) stars[starKey].ct++;
                                else stars[starKey].comp++;
                            }
                        }
                    }
                });

                const winRate = totalValid > 0 ? ((ctWins / totalValid) * 100).toFixed(1) : 0;
                
                const barSupplierData = [
                    { name: "cleartrip", value: suppliers.cleartrip, color: SUP_COLORS.cleartrip },
                    { name: "makemytrip", value: suppliers.makemytrip, color: SUP_COLORS.makemytrip },
                    { name: "yatra", value: suppliers.yatra, color: SUP_COLORS.yatra },
                    { name: "tripsure", value: suppliers.tripsure, color: SUP_COLORS.tripsure }
                ].filter(d => d.value > 0).sort((a, b) => b.value - a.value);

                const totalSupValue = barSupplierData.reduce((acc, curr) => acc + curr.value, 0);
                barSupplierData.forEach(d => {
                    d.percent = totalSupValue > 0 ? ((d.value / totalSupValue) * 100).toFixed(1) + '%' : '0%';
                });

                const barData = Object.keys(stars)
                    .filter(key => stars[key].ct > 0 || stars[key].comp > 0)
                    .map(key => {
                        const ct = stars[key].ct;
                        const comp = stars[key].comp;
                        const total = ct + comp;
                        const ctPercent = total > 0 ? ((ct / total) * 100).toFixed(0) + '%' : '';
                        return {
                            name: key,
                            "ct win": ct,
                            "comp win": comp,
                            ctPercent: ctPercent
                        };
                    }).reverse();

                const finalCityStats = Object.keys(cStats).map(k => {
                    const stat = cStats[k];
                    const wRate = stat.totalValid > 0 ? ((stat.ctWins / stat.totalValid) * 100).toFixed(1) : 0;
                    
                    let topSup = "none";
                    let maxSupVal = 0;
                    Object.entries(stat.sups).forEach(([s, v]) => {
                        if(v > maxSupVal) { maxSupVal = v; topSup = s; }
                    });

                    return { city: k, winRate: wRate, properties: stat.totalProps, topCompetitor: topSup };
                });

                                    className={`px-6 py-2 text-xs font-black rounded-lg transition-all flex items-center gap-1.5 ${searchMode==='single'?'bg-white shadow-md text-slate-800':'text-slate-500 hover:text-slate-700'}`}>
                                    single city
                                    {tabStatus.single === 'loading' && <svg className="animate-spin w-3 h-3 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>}
                                    {tabStatus.single === 'completed' && searchMode !== 'single' && <svg className="w-3 h-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>}
                                </button>
                                <button 
                                    onClick={() => { setSearchMode('bulk'); setTabStatus(prev => ({...prev, bulk: 'idle'})); }} 
                                    className={`px-6 py-2 text-xs font-black rounded-lg transition-all flex items-center gap-1.5 ${searchMode==='bulk'?'bg-white shadow-md text-slate-800':'text-slate-500 hover:text-slate-700'}`}>
                                    bulk process (beta)
                                    {tabStatus.bulk === 'loading' && <svg className="animate-spin w-3 h-3 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>}
                                    {tabStatus.bulk === 'completed' && searchMode !== 'bulk' && <svg className="w-3 h-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>}
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={onLock} className="text-xs font-bold text-slate-500 hover:text-slate-900 bg-slate-100/80 px-4 py-2 rounded-xl border border-slate-200 shadow-sm transition-all">
                                lock session
                            </button>
                        </div>
                    </nav>

                    <SearchEngine mode="single" activeMode={searchMode} setMode={setSearchMode} citiesList={citiesList} onLoadStart={() => setTabStatus(p => ({...p, single: 'loading'}))} onLoadEnd={() => setTabStatus(p => ({...p, single: 'completed'}))} />
                    <SearchEngine mode="bulk" activeMode={searchMode} setMode={setSearchMode} citiesList={citiesList} onLoadStart={() => setTabStatus(p => ({...p, bulk: 'loading'}))} onLoadEnd={() => setTabStatus(p => ({...p, bulk: 'completed'}))} />
                </div>
            );
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [hasShattered, setHasShattered] = useState(false);

            const handleUnlock = () => {
                setHasShattered(true);
                setTimeout(() => setIsLocked(false), 700); 
            };

            return (
                <div className="relative min-h-screen">
                    <DashboardContainer onLock={() => { setIsLocked(true); setHasShattered(false); }} />
                    
                    <div className={`fixed inset-0 z-[999999] bg-slate-50 transition-opacity duration-700 flex items-center justify-center ${isLocked && !hasShattered ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                        {isLocked && <LockScreen onUnlock={handleUnlock} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
